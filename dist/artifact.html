<title>CGV Genome Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="CGV — a fast in-browser viewer for BAM alignments">
<style>
/* Data fills the screen; the UI is one thin bar on top plus slide-in panels. */
:root {
  --bg: #fafbfb; --panel: #ffffff; --fg: #1b1f24; --muted: #6a717b; --line: #e2e5e9; --accent: #0b6e8a;
  --read: #b9bec6; --read-fwd: #d8a9a6; --read-rev: #9fb5d6; --cov: #a8aeb7;
  --del: #2a2e34; --ins: #7a3fd0; --clip: #d23f8a;
  --pair-large: #d0453c; --pair-small: #3b6fd4; --pair-rf: #3d9a5c; --pair-ff: #1e9aa3; --pair-unmapped: #d49a1a;
  --base-a: #1e9a4e; --base-c: #2a5fd6; --base-g: #d48a0f; --base-t: #d0362f;
  --cat-1: #d0453c; --cat-2: #3b6fd4; --cat-3: #3d9a5c; --cat-4: #b05fc7; --cat-5: #d49a1a; --cat-6: #1e9aa3; --cat-7: #8a6a4a; --cat-8: #c95f8f;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --bar-h: 40px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --panel: #1a1d21; --fg: #e3e6ea; --muted: #959ca6; --line: #2a2f35; --accent: #4cb4d4;
  --read: #4e555e; --read-fwd: #7d5654; --read-rev: #4d6283; --cov: #69717b;
  --del: #dfe3e8; --ins: #a77bf0; --clip: #ec6aac;
  --pair-large: #e8665d; --pair-small: #6d96ec; --pair-rf: #5cbf7c; --pair-ff: #3cc0c8; --pair-unmapped: #e8b542;
  --base-a: #3cc06e; --base-c: #5a89f0; --base-g: #f0a73a; --base-t: #f0605a;
  --cat-1: #e8665d; --cat-2: #6d96ec; --cat-3: #5cbf7c; --cat-4: #c98ae0; --cat-5: #e8b542; --cat-6: #3cc0c8; --cat-7: #b8916b; --cat-8: #e486b1;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121417; --panel: #1a1d21; --fg: #e3e6ea; --muted: #959ca6; --line: #2a2f35; --accent: #4cb4d4;
  --read: #4e555e; --read-fwd: #7d5654; --read-rev: #4d6283; --cov: #69717b;
  --del: #dfe3e8; --ins: #a77bf0; --clip: #ec6aac;
  --pair-large: #e8665d; --pair-small: #6d96ec; --pair-rf: #5cbf7c; --pair-ff: #3cc0c8; --pair-unmapped: #e8b542;
  --base-a: #3cc06e; --base-c: #5a89f0; --base-g: #f0a73a; --base-t: #f0605a;
  --cat-1: #e8665d; --cat-2: #6d96ec; --cat-3: #5cbf7c; --cat-4: #c98ae0; --cat-5: #e8b542; --cat-6: #3cc0c8; --cat-7: #b8916b; --cat-8: #e486b1;
  color-scheme: dark; }

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--sans); overflow: hidden; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.bar { height: var(--bar-h); flex: none; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); background: var(--bg); min-width: 0; }
body.bare .bar { display: none; }
.mark { font: 700 13px/1 var(--mono); letter-spacing: .06em; color: var(--accent); flex: none; }
.locus { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 0 1 330px; }
#locus { width: 100%; min-width: 0; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
#span { color: var(--muted); font: 11.5px var(--mono); white-space: nowrap; }
.btn { height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
select.btn { padding-right: 4px; flex: none; max-width: 170px; }
.file { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
.status { color: var(--muted); font: 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
@media (max-width: 900px) { .status, .file { display: none; } }
@media (max-width: 560px) { #span, #examples { display: none; } .locus { flex-basis: 200px; } }

#stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#stage:active { cursor: grabbing; }
#stage.drop::after { content: attr(data-drop-text); position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 10px; display: grid; place-items: center; color: var(--accent); font-weight: 600; background: color-mix(in srgb, var(--bg) 80%, transparent); }
#gl, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.msg { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); max-width: min(520px, calc(100% - 32px)); padding: 10px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 24px rgb(0 0 0 / .08); text-align: center; }
.msg.err { border-color: var(--pair-large); }
.spin { display: inline-block; width: 11px; height: 11px; margin-right: 8px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.card { position: absolute; z-index: 5; width: min(360px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgb(0 0 0 / .14); padding: 10px 12px; cursor: auto; user-select: text; -webkit-user-select: text; }
.card dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; font-size: 12px; }
.card dt { color: var(--muted); }
.card dd { margin: 0; font-family: var(--mono); font-size: 11.5px; word-break: break-all; min-width: 0; }
.card-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

.side { position: absolute; z-index: 10; top: var(--bar-h); right: 0; bottom: 0; width: min(330px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 28px rgb(0 0 0 / .08); overflow: auto;
  padding-block: 12px 24px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.side header { display: flex; align-items: center; justify-content: space-between; }
.side header h1 { font-size: 14px; margin: 0; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; margin-bottom: 10px; }
.field label { font-size: 12.5px; }
.field output { font: 11.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.field input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.field select, .field input[type=text], .field input[type=number], .field input[type=url], .field input[type=password] { grid-column: 1 / -1; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); min-width: 0; width: 100%; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.field > *, .pair > * { min-width: 0; }
.pair .field input { grid-column: 1 / -1; }
.check { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12.5px; }
.check input { accent-color: var(--accent); }
.legend { height: 10px; border-radius: 3px; border: 1px solid var(--line); }
.legend-labels { display: flex; justify-content: space-between; font: 10.5px var(--mono); color: var(--muted); margin-top: 3px; }
.hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
textarea { width: 100%; min-height: 140px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font: 11px/1.45 var(--mono); padding: 8px; resize: vertical; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.drop-zone { display: grid; place-items: center; gap: 6px; padding: 18px 12px; border: 1.5px dashed var(--line); border-radius: 8px; text-align: center; color: var(--muted); cursor: pointer; }
.drop-zone:hover { border-color: var(--accent); color: var(--fg); }
.drop-zone strong { color: var(--fg); }
.drop-zone span { display: block; }
.ref-info { color: var(--fg); margin: 0 0 8px; }
.keys { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; font-size: 12px; margin: 0; }
.keys dt { font-family: var(--mono); color: var(--muted); }
.keys dd { margin: 0; }

.toast { position: fixed; z-index: 20; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 12.5px; max-width: min(720px, calc(100% - 32px)); cursor: pointer; overflow-wrap: anywhere; }
#showToolbar { position: absolute; z-index: 6; top: max(6px, env(safe-area-inset-top, 0px)); right: max(6px, env(safe-area-inset-right, 0px)); opacity: .7; }
#showToolbar:hover { opacity: 1; }
body.bare .side { top: 0; }
</style>

<header class="bar">
  <span class="mark" title="Convenient, custom, genomic viewer">CGV</span>
  <div class="locus">
    <input id="locus" type="text" spellcheck="false" autocomplete="off" data-i18n-aria="locus.aria" aria-label="Locus: contig:start-end" placeholder="chr7:117,559,500-117,560,000">
    <span id="span"></span>
  </div>
  <select id="examples" class="btn" data-i18n-aria="examples" aria-label="Examples" hidden>
    <option value="" data-i18n="examples">Examples</option>
    <option value="demo:11,941-12,060" data-i18n="ex.hetSnv">SNV, heterozygous</option>
    <option value="demo:14,941-15,060" data-i18n="ex.homSnv">SNV, homozygous</option>
    <option value="demo:17,941-18,062" data-i18n="ex.del3">3 bp deletion</option>
    <option value="demo:20,941-21,060" data-i18n="ex.ins3">3 bp insertion</option>
    <option value="demo:24,201-28,800" data-i18n="ex.del3k">3 kb deletion</option>
    <option value="demo:29,601-34,000" data-i18n="ex.repeat">Segmental duplication, MAPQ 0</option>
    <option value="demo:21,601-22,500" data-i18n="ex.chim">Mates on another contig</option>
    <option value="demo:1-40,000" data-i18n="ex.whole">Whole contig</option>
  </select>
  <span class="file" id="fileName"></span>
  <span class="status" id="status"></span>
  <button class="btn" id="openBtn" aria-expanded="false" aria-controls="openPanel" data-i18n="btn.open">Open</button>
  <button class="btn" id="viewBtn" aria-expanded="false" aria-controls="panel" data-i18n="btn.view">View</button>
</header>

<main id="stage" data-i18n-drop="drop" data-drop-text="Drop .bam and .bai files">
  <canvas id="gl"></canvas>
  <canvas id="ov"></canvas>
  <div id="msg" class="msg" hidden></div>
  <div id="card" class="card" hidden></div>
  <button class="btn" id="showToolbar" hidden data-i18n="btn.toolbar">Toolbar (H)</button>

  <aside id="openPanel" class="side" hidden data-i18n-aria="open.title" aria-label="Open data">
    <header><h1 data-i18n="open.title">Open data</h1><button class="btn ghost" data-close data-i18n="btn.close">Close</button></header>
    <section>
      <h2 data-i18n="open.disk">From disk</h2>
      <label class="drop-zone" for="pickFiles"><strong data-i18n="open.pick">Choose .bam and .bai</strong><span data-i18n="open.pickSub">you can add .fa and .fai</span><span data-i18n="open.pickDrop">or drop files onto the screen</span></label>
      <input id="pickFiles" type="file" multiple accept=".bam,.bai,.fa,.fasta,.fna,.gz,.fai,.gzi" hidden>
      <p class="hint" data-i18n="open.diskHint">Files are read in pieces straight from disk and are never uploaded.</p>
    </section>
    <section>
      <h2 data-i18n="open.url">By link</h2>
      <div class="field"><label for="urlBam" data-i18n="open.urlBam">BAM</label><input id="urlBam" type="url" placeholder="https://…/sample.bam"></div>
      <div class="field"><label for="urlBai" data-i18n="open.urlBai">Index (if not next to the BAM)</label><input id="urlBai" type="url" data-i18n-ph="open.urlBaiPh" placeholder="default: link + .bai"></div>
      <div class="field"><label for="urlAuth" data-i18n="open.urlAuth">Access token (optional)</label><input id="urlAuth" type="password" autocomplete="off" placeholder="Bearer …"></div>
      <div class="row-actions"><button class="btn primary" id="openUrl" data-i18n="open.urlBtn">Open link</button></div>
      <p class="hint" data-i18n="open.urlHint"></p>
    </section>
    <section>
      <h2 data-i18n="ref.title">Reference</h2>
      <p class="hint ref-info" id="refInfo"></p>
      <label class="drop-zone" for="pickRef"><strong data-i18n="ref.pick">Choose .fa and .fai</strong><span data-i18n="ref.pickSub">for .fa.gz also choose .gzi</span></label>
      <input id="pickRef" type="file" multiple accept=".fa,.fasta,.fna,.gz,.fai,.gzi" hidden>
      <div class="field"><label for="refPreset" data-i18n="ref.preset">Public genome</label>
        <select id="refPreset"><option value="" data-i18n="ref.presetNone">Choose…</option><option value="hg38">GRCh38 / hg38</option><option value="hg19">GRCh37 / hg19</option><option value="chm13">T2T-CHM13 v2.0</option></select></div>
      <div class="field"><label for="refUrl" data-i18n="ref.url">FASTA link</label><input id="refUrl" type="url" data-i18n-ph="ref.urlPh" placeholder="https://…/genome.fa (.fai next to it)"></div>
      <div class="row-actions"><button class="btn primary" id="loadRef" data-i18n="ref.load">Load reference</button></div>
      <p class="hint" data-i18n="ref.presetHint"></p>
      <p class="hint" data-i18n="ref.hint"></p>
    </section>
    <section>
      <h2 data-i18n="open.demo">Demo</h2>
      <button class="btn" id="openDemo" data-i18n="open.demoBtn">Synthetic demo data</button>
      <p class="hint" data-i18n="open.demoHint"></p>
    </section>
  </aside>

  <aside id="panel" class="side" hidden data-i18n-aria="view.title" aria-label="View settings">
    <header><h1 data-i18n="view.title">View</h1><button class="btn ghost" data-close data-i18n="btn.close">Close</button></header>
    <section>
      <h2 data-i18n="view.reads">Reads</h2>
      <div class="field"><label for="readHeight" data-i18n="view.readHeight">Read height</label><output id="readHeightOut"></output><input id="readHeight" type="range" min="1" max="24" step="0.5"></div>
      <div class="field"><label for="colorBy" data-i18n="view.colorBy">Color by</label>
        <select id="colorBy"><option value="none" data-i18n="color.none"></option><option value="strand" data-i18n="color.strand"></option><option value="pair" data-i18n="color.pair"></option><option value="tag" data-i18n="color.tag"></option></select></div>
      <div class="field" id="colorTagRow"><label for="colorTag" data-i18n="view.colorTag">Tag for color</label><input id="colorTag" type="text" maxlength="2" spellcheck="false"></div>
      <div class="check"><input id="bqShade" type="checkbox"><label for="bqShade" data-i18n="view.bqShade"></label></div>
      <div class="check"><input id="softClips" type="checkbox"><label for="softClips" data-i18n="view.softClips"></label></div>
    </section>
    <section>
      <h2 data-i18n="view.mq">MAPQ transparency</h2>
      <div class="pair">
        <div class="field"><label for="mqLow" data-i18n="view.mqLow">From MQ</label><input id="mqLow" type="number" min="0" max="255" step="1"></div>
        <div class="field"><label for="mqHigh" data-i18n="view.mqHigh">To MQ</label><input id="mqHigh" type="number" min="0" max="255" step="1"></div>
      </div>
      <div class="field"><label for="mqMinAlpha" data-i18n="view.mqMinAlpha"></label><output id="mqMinAlphaOut"></output><input id="mqMinAlpha" type="range" min="0.02" max="1" step="0.01"></div>
      <div class="legend" id="mqLegend"></div>
      <div class="legend-labels"><span id="mqLegendLo"></span><span id="mqLegendHi"></span></div>
      <p class="hint" data-i18n="view.mqHint"></p>
    </section>
    <section>
      <h2 data-i18n="view.groupSort">Group and sort</h2>
      <div class="field"><label for="groupBy" data-i18n="view.groupBy">Group by</label>
        <select id="groupBy"><option value="none" data-i18n="group.none"></option><option value="strand" data-i18n="group.strand"></option><option value="firstOfPair" data-i18n="group.firstOfPair"></option><option value="pair" data-i18n="group.pair"></option><option value="tag" data-i18n="group.tag"></option></select></div>
      <div class="field" id="groupTagRow"><label for="groupTag" data-i18n="view.groupTag">Tag for grouping</label><input id="groupTag" type="text" maxlength="2" spellcheck="false"></div>
      <div class="field"><label for="sortBy" data-i18n="view.sortBy">Sort rows</label>
        <select id="sortBy"><option value="start" data-i18n="sort.start"></option><option value="base" data-i18n="sort.base"></option><option value="mapq" data-i18n="sort.mapq"></option><option value="strand" data-i18n="sort.strand"></option><option value="insert" data-i18n="sort.insert"></option></select></div>
      <div class="row-actions"><button class="btn" id="sortHere" data-i18n="view.sortHere">Sort at screen center (S)</button></div>
    </section>
    <section>
      <h2 data-i18n="view.filters">Filters</h2>
      <div class="field"><label for="minMapq" data-i18n="view.minMapq">Minimum MAPQ</label><input id="minMapq" type="number" min="0" max="255" step="1"></div>
      <div class="check"><input id="hideDup" type="checkbox"><label for="hideDup" data-i18n="view.hideDup"></label></div>
      <div class="check"><input id="hideSec" type="checkbox"><label for="hideSec" data-i18n="view.hideSec"></label></div>
      <div class="check"><input id="hideSupp" type="checkbox"><label for="hideSupp" data-i18n="view.hideSupp"></label></div>
      <div class="check"><input id="hideQc" type="checkbox"><label for="hideQc" data-i18n="view.hideQc"></label></div>
      <div class="check"><input id="dsOn" type="checkbox"><label for="dsOn" data-i18n="view.downsample"></label></div>
      <div class="pair">
        <div class="field"><label for="dsMax" data-i18n="view.dsMax">Reads per window</label><input id="dsMax" type="number" min="1" max="100000" step="1"></div>
        <div class="field"><label for="dsWin" data-i18n="view.dsWin">Window, bp</label><input id="dsWin" type="number" min="1" max="100000" step="1"></div>
      </div>
      <p class="hint" data-i18n="view.dsHint"></p>
    </section>
    <section>
      <h2 data-i18n="view.coverage">Coverage</h2>
      <div class="field"><label for="covHeight" data-i18n="view.covHeight">Track height</label><output id="covHeightOut"></output><input id="covHeight" type="range" min="20" max="200" step="2"></div>
      <div class="field"><label for="alleleThr" data-i18n="view.alleleThr">Highlight alleles from</label><output id="alleleThrOut"></output><input id="alleleThr" type="range" min="0.02" max="0.5" step="0.01"></div>
    </section>
    <section>
      <h2 data-i18n="view.screen">Screen</h2>
      <div class="field"><label for="language" data-i18n="view.language">Language</label><select id="language"></select></div>
      <div class="check"><input id="hideToolbar" type="checkbox"><label for="hideToolbar" data-i18n="view.hideToolbar"></label></div>
    </section>
    <section>
      <h2 data-i18n="view.profile">Profile</h2>
      <textarea id="profileJson" spellcheck="false" data-i18n-aria="view.profileAria" aria-label="Display profile as JSON"></textarea>
      <div class="row-actions"><button class="btn" id="copyProfile" data-i18n="view.copy">Copy</button><button class="btn" id="applyProfile" data-i18n="view.apply">Apply from field</button><button class="btn ghost" id="resetProfile" data-i18n="view.reset">Reset</button></div>
      <p class="hint" data-i18n="view.profileHint"></p>
    </section>
    <section>
      <h2 data-i18n="view.controls">Controls</h2>
      <dl class="keys">
        <dt data-i18n="keys.drag"></dt><dd data-i18n="keys.dragD"></dd>
        <dt data-i18n="keys.wheel"></dt><dd data-i18n="keys.wheelD"></dd>
        <dt data-i18n="keys.ctrlWheel"></dt><dd data-i18n="keys.ctrlWheelD"></dd>
        <dt data-i18n="keys.dbl"></dt><dd data-i18n="keys.dblD"></dd>
        <dt data-i18n="keys.arrows"></dt><dd data-i18n="keys.arrowsD"></dd>
        <dt>S</dt><dd data-i18n="keys.s"></dd>
        <dt>H</dt><dd data-i18n="keys.h"></dd>
        <dt data-i18n="keys.click"></dt><dd data-i18n="keys.clickD"></dd>
      </dl>
    </section>
  </aside>
</main>

// CGV core: data sources, BGZF, BAI, BAM, FASTA, model (coverage, layout).
// No external dependencies. Decompression uses the browser's built-in DecompressionStream('deflate-raw').
'use strict';

// ======================= Data sources =======================
// One interface: read(start, len) -> Uint8Array, readAll() -> Uint8Array.
class FileSource {
  constructor(blob, name) { this.blob = blob; this.name = name || blob.name || 'file'; this.bytes = 0; }
  async read(start, len) {
    const end = Math.min(start + len, this.blob.size);
    if (end <= start) return new Uint8Array(0);
    const b = new Uint8Array(await this.blob.slice(start, end).arrayBuffer());
    this.bytes += b.length; return b;
  }
  async readAll() { const b = new Uint8Array(await this.blob.arrayBuffer()); this.bytes += b.length; return b; }
}

class UrlSource {
  constructor(url, headers) {
    this.url = url; this.headers = headers || {}; this.bytes = 0;
    try { this.name = decodeURIComponent(new URL(url).pathname.split('/').pop()) || url; } catch (e) { this.name = url; }
  }
  async _fetch(range) {
    const h = Object.assign({}, this.headers);
    if (range) h.Range = range;
    let r;
    try { r = await fetch(this.url, { headers: h, credentials: 'omit', mode: 'cors' }); }
    catch (e) { throw new CgvError('network', { name: this.name }); }
    if (r.status === 401 || r.status === 403) throw new CgvError('auth', { status: r.status, name: this.name });
    if (r.status === 404) throw new CgvError('notfound', { name: this.name });
    if (!r.ok) throw new CgvError('http', { status: r.status, name: this.name });
    return r;
  }
  async read(start, len) {
    const r = await this._fetch('bytes=' + start + '-' + (start + len - 1));
    const buf = new Uint8Array(await r.arrayBuffer());
    this.bytes += buf.length;
    if (r.status === 200) { // server ignored Range and sent the whole file
      this.noRange = true;
      return buf.subarray(start, Math.min(start + len, buf.length));
    }
    return buf;
  }
  async readAll() { const r = await this._fetch(null); const b = new Uint8Array(await r.arrayBuffer()); this.bytes += b.length; return b; }
}

class CgvError extends Error {
  constructor(code, vars) {
    super((CGV_ERR_EN[code] || code).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? vars[k] : m)));

// ======================= BGZF =======================
async function inflateRaw(u8) {
  const ds = new DecompressionStream('deflate-raw');
  const w = ds.writable.getWriter();
  w.write(u8).catch(() => {}); w.close().catch(() => {});
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}

function parseBgzfBlocks(buf, baseCoff) {
  const blocks = []; let p = 0;
  while (p + 18 <= buf.length) {
    if (buf[p] !== 31 || buf[p + 1] !== 139) throw new CgvError('bgzf', { offset: baseCoff + p });
    const xlen = buf[p + 10] | (buf[p + 11] << 8);
    let q = p + 12, bsize = -1; const xend = p + 12 + xlen;
    while (q + 4 <= xend) {
      const slen = buf[q + 2] | (buf[q + 3] << 8);
      if (buf[q] === 66 && buf[q + 1] === 67) bsize = buf[q + 4] | (buf[q + 5] << 8);
      q += 4 + slen;
    }
    if (bsize < 0) throw new CgvError('bsize');
    const total = bsize + 1;
    if (p + total > buf.length) break;
    blocks.push({ coff: baseCoff + p, cstart: p + 12 + xlen, clen: total - xlen - 20 });
    p += total;
  }
  return blocks;
}

// Reads and inflates the blocks from cStart through the block starting at cLast.
async function readBgzf(source, cStart, cLast) {
  const raw = await source.read(cStart, cLast - cStart + 65536);
  const blocks = parseBgzfBlocks(raw, cStart).filter(b => b.coff <= cLast);
  const parts = await Promise.all(blocks.map(b => inflateRaw(raw.subarray(b.cstart, b.cstart + b.clen))));
  let total = 0; const offs = new Map();
  blocks.forEach((b, i) => { offs.set(b.coff, total); total += parts[i].length; });
  const data = new Uint8Array(total); let o = 0;
  for (const p of parts) { data.set(p, o); o += p.length; }
  return { data, offs };
}

// ======================= BAI =======================
// BGZF virtual offset as a Number: coffset * 65536 + uoffset (exact for files up to ~137 GB).
function voffNum(dv, o) { const lo = dv.getUint32(o, true), hi = dv.getUint32(o + 4, true); return (hi * 65536 + (lo >>> 16)) * 65536 + (lo & 0xffff); }

function reg2bins(beg, end) {
  const list = [0]; end -= 1;
  for (let k = 1 + (beg >> 26); k <= 1 + (end >> 26); k++) list.push(k);
  for (let k = 9 + (beg >> 23); k <= 9 + (end >> 23); k++) list.push(k);
  for (let k = 73 + (beg >> 20); k <= 73 + (end >> 20); k++) list.push(k);
  for (let k = 585 + (beg >> 17); k <= 585 + (end >> 17); k++) list.push(k);
  for (let k = 4681 + (beg >> 14); k <= 4681 + (end >> 14); k++) list.push(k);
  return list;
}

// ======================= BAM =======================
function latin1(u8, start, len) { let s = ''; for (let i = 0; i < len; i++) s += String.fromCharCode(u8[start + i]); return s; }

}
function qualAlpha(q) { if (!P.baseQualityShading || q === 255) return 1; if (q < 5) return 0.2; if (q < 20) return 0.2 + 0.8 * (q - 5) / 15; return 1; }

function readColor(rec) {

    case 'strand': return rec.flag & F_REV ? COL.rev : COL.fwd;
    case 'tag': { const v = recTags(rec)[P.colorTag]; return v === undefined ? COL.read : COL.cat[hashStr(v) % 8]; }

      const o = pairOrientation(rec), ins = S.data.insert;
      if (o === 'other') return COL.cat[(rec.mateRef >>> 0) % 8];
      if (o === 'mateUnmapped') return COL.mu;
      if (o === 'RF') return COL.rf;
      if (o === 'FF' || o === 'RR') return COL.ff;
      if (o === 'FR') { const t = Math.abs(rec.tlen); if (t > ins.hi) return COL.big; if (t && t < ins.lo) return COL.small; }
      return COL.read;

    default: return COL.read;
  }
}

function groupKey(rec) {
  switch (P.groupBy) {
    case 'strand': return rec.flag & F_REV ? t('g.rev') : t('g.fwd');
    case 'firstOfPair': return rec.flag & F_R1 ? t('g.first') : rec.flag & F_R2 ? t('g.second') : t('g.unpaired');
    case 'pair': { const o = pairOrientation(rec); return { FR: t('g.FR'), RF: 'RF', FF: 'FF', RR: 'RR', other: t('g.other'), mateUnmapped: t('g.mateUnmapped'), unpaired: t('g.unpaired') }[o]; }
    case 'tag': { const v = recTags(rec)[P.groupTag]; return v === undefined ? t('g.tagNone', { tag: P.groupTag }) : P.groupTag + ': ' + v; }
    default: return '';
  }
}

function refAtFactory() { const d = S.data; return p => { const j = p - d.start; return j >= 0 && j < d.refArr.length ? d.refArr[j] : 0; }; }
function feats(rec) { if (!rec.feats) rec.feats = computeFeatures(rec, refAtFactory()); return rec.feats; }

// Full rebuild: filters → downsampling → coverage → groups → layout → sort → instances.
function rebuild() {
  const d = S.data; if (!d) { S.shown = null; GL.n = 0; return; }
  const t0 = performance.now();
  // reads are already filtered (and downsampled) while loading; coverage came with them
  let reads = d.reads;
  let sampled = reads.length < d.total;
  if (reads.length > P.maxReads) { // even downsampling with a fixed step, deterministic
    const step = reads.length / P.maxReads, out = [];
    for (let i = 0; i < P.maxReads; i++) out.push(reads[Math.floor(i * step)]);
    reads = out; sampled = true;
  }
  const cov = d.cov;
  // groups
  const gmap = new Map();
  for (const r of reads) { const k = groupKey(r); if (!gmap.has(k)) gmap.set(k, []); gmap.get(k).push(r); }
  const keys = [...gmap.keys()].sort((a, b) => a.localeCompare(b, LANG));
  const groups = []; let rowCursor = 0;
  for (const k of keys) {
    const rows = packRows(gmap.get(k), 3);
    sortRows(rows);
    groups.push({ key: k, rows, start: rowCursor, count: gmap.get(k).length });
    rowCursor += rows.length;
  }
  // instances: bodies → lines → features on top
  const ib = new InstBuf(Math.max(1024, reads.length * 3));
  const bodies = [], marks = [];
  groups.forEach((g, gi) => g.rows.forEach((row, ri) => { const R = g.start + ri; for (const rec of row) { bodies.push([rec, R, gi]); } }));
  for (const [rec, R, gi] of bodies) {
    const col = readColor(rec), a = mapqAlpha(rec.mapq);
    // bodies per aligned block, broken at D/N
    let r = rec.pos, segStart = rec.pos;
    for (const c of rec.cigar) {
      const op = c & 15, n = c >>> 4;
      if (op === 0 || op === 7 || op === 8) r += n;
      else if (op === 2 || op === 3) {
        if (r > segStart) ib.add(segStart - d.start, r - d.start, R, gi, 0, 1, 1, col, a);
        marks.push([op === 2 ? 2 : 3, r, r + n, R, gi, a]);
        r += n; segStart = r;
      }
    }
    if (r > segStart) ib.add(segStart - d.start, r - d.start, R, gi, 0, 1, 1, col, a);
  }
  for (const [t, x0, x1, R, gi, a] of marks) ib.add(x0 - d.start, x1 - d.start, R, gi, t === 2 ? 0.44 : 0.48, t === 2 ? 0.56 : 0.52, 0, t === 2 ? COL.del : COL.skip, a);
  for (const [rec, R, gi] of bodies) {
    const a = mapqAlpha(rec.mapq);
    for (const f of feats(rec)) {
      if (f.t === 0) ib.add(f.pos - d.start, f.pos + 1 - d.start, R, gi, 0, 1, flaggedPos(cov, d, f.pos) ? 1 : -1, COL.base[f.b] || COL.base[78], a * qualAlpha(f.q));
      else if (f.t === 1) ib.add(f.pos - d.start, f.pos - d.start, R, gi, -0.08, 1.08, 2, COL.ins, Math.max(a, 0.6));
      else if ((f.t === 4 || f.t === 5) && P.showSoftClips && f.len >= 1) ib.add(f.pos - d.start, f.pos - d.start, R, gi, 0, 1, 1.5, COL.clip, Math.max(a, 0.7));
    }
  }
  S.shown = { reads, cov, groups, totalRows: rowCursor, sampled, total: d.total };
  if (GL_OK) {
    gl.bindBuffer(gl.ARRAY_BUFFER, GL.fbuf); gl.bufferData(gl.ARRAY_BUFFER, ib.f.subarray(0, ib.n * 7), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, GL.cbuf); gl.bufferData(gl.ARRAY_BUFFER, ib.c.subarray(0, ib.n * 4), gl.STATIC_DRAW);
    GL.n = ib.n;
  }
  S.stats.buildMs = performance.now() - t0;
  S.stats.reads = d.total;
  clampScroll();
}

// A position where non-reference alleles pass the threshold (same rule as the coverage highlight).
function flaggedPos(cov, d, pos) {
  const j = (pos - d.start) * 6, refc = d.refArr[pos - d.start];
  if (j < 0 || j >= cov.length || !refc) return false;
  const t = cov[j] + cov[j + 1] + cov[j + 2] + cov[j + 3] + cov[j + 4]; if (t < 2) return false;
  const ri = { 65: 0, 67: 1, 71: 2, 84: 3 }[refc]; if (ri === undefined) return false;
  return (t - cov[j + ri]) / t >= P.coverage.alleleThreshold;
}

function sortRows(rows) {
  if (P.sortBy === 'start') return;
  const pos = S.sortPos != null ? S.sortPos : Math.floor(viewCenter());
  const refAt = refAtFactory(), rb = refAt(pos);
  const keyOf = row => {
    const rec = row.find(r => r.pos <= pos && r.end > pos);
    if (!rec) return [9, 0];
    switch (P.sortBy) {
      case 'base': { const b = baseAtRefPos(rec, pos); if (!b) return [8, 0]; if (b === 45) return [2, 0]; return b === rb ? [3, 0] : [1, b]; }
      case 'mapq': return [1, -rec.mapq];
      case 'strand': return [1, rec.flag & F_REV ? 1 : 0];
      case 'insert': return [1, -Math.abs(rec.tlen)];
    }
    return [1, 0];
  };
  const keyed = rows.map(r => [keyOf(r), r]);
  keyed.sort((a, b) => a[0][0] - b[0][0] || a[0][1] - b[0][1]);
  for (let i = 0; i < rows.length; i++) rows[i] = keyed[i][1];
}

// ======================= View =======================
// Coordinates come from the reference when one is loaded, otherwise from the BAM header.
// S.contigs: [{ name, len }]; S.bamMap[viewContig] = BAM ref id or -1; S.bamBack[bamRef] = view contig or -1.
function refLen() { return S.contigs ? S.contigs[S.view.refId].len : 0; }
function contigId(name) {

  if (!S._ck) { S._ck = new Map(); S.contigs.forEach((c, i) => { for (const k of contigKeys(c.name)) if (!S._ck.has(k)) S._ck.set(k, i); }); }
  for (const k of contigKeys(name)) if (S._ck.has(k)) return S._ck.get(k);
  return -1;
}
function viewEnd() { return S.view.start + W * S.view.bpPerPx; }
function viewCenter() { return S.view.start + W * S.view.bpPerPx / 2; }
function clampView() {
  const L = refLen(); if (!L || !W) return;
  const minBpp = 1 / 48, maxBpp = Math.max(minBpp, L / W);
  S.view.bpPerPx = Math.min(maxBpp, Math.max(minBpp, S.view.bpPerPx));
  const span = W * S.view.bpPerPx;
  S.view.start = Math.min(L - span * 0.5, Math.max(-span * 0.5, S.view.start));
}
function contentHeight() { if (!S.shown) return 0; return S.shown.totalRows * P.readHeight + S.shown.groups.length * groupGap(); }

function goto(refId, start, end) {
  S.view.refId = refId;
  const span = Math.max(20, end - start);
  S.view.bpPerPx = span / Math.max(1, W);
  S.view.start = start;
  clampView(); S.scroll = 0; requestLoad(); draw(); syncLocus();
}
function zoomAt(px, factor) {
  const bp = S.view.start + px * S.view.bpPerPx;
  S.view.bpPerPx *= factor; clampView();
  S.view.start = bp - px * S.view.bpPerPx; clampView();
  requestLoad(); draw(); syncLocus();
}
function pan(dpx) { S.view.start += dpx * S.view.bpPerPx; clampView(); requestLoad(); draw(); syncLocus(); }

// ======================= Loading =======================
let loadTimer = 0;
function requestLoad() { clearTimeout(loadTimer); loadTimer = setTimeout(ensureData, 120); }
async function ensureData() {
  if (!S.contigs || !W) return;
  const vs = Math.max(0, Math.floor(S.view.start)), ve = Math.min(refLen(), Math.ceil(viewEnd()));
  const d = S.data;
  if (d && d.refId === S.view.refId && vs >= d.start && ve <= d.end) return;
  const span = ve - vs, margin = Math.round(Math.min(span, 20000) / 2);
  const ls = Math.max(0, vs - margin), le = Math.min(refLen(), ve + margin);
  // decide by the amount of data the index points to, not by window length: 30x WGS and a
  // 3000x panel differ a hundredfold for the same window
  const bamRef = S.bam ? S.bamMap[S.view.refId] : -1;
  if (!S.bam && span > 1e6) { S.data = null; S.shown = null; GL.n = 0; S.msg = null; draw(); return; } // reference only: bases are drawn when zoomed in
  const est = bamRef >= 0 ? S.bam.estimateBytes(bamRef, ls, le) : 0;
  if (est > P.maxLoadMB * 1048576 && !S.forceLoad) {
    S.data = null; S.shown = null; GL.n = 0;
    const size = fmtBytes(est);
    S.msg = { text: t('wide', { span: fmtBp(span), size }), action: t('wide.btn', { size }) };
    draw(); return;
  }
  S.forceLoad = false;
  const token = ++S.loadToken; S.loading = true; S.msg = null; draw();
  const t0 = performance.now();
  try {
    const res = bamRef >= 0 ? await S.bam.fetch(bamRef, ls, le, {
      filters: P.filters,
      downsample: P.downsample.enabled ? { max: P.downsample.maxReads, window: P.downsample.window } : null,
    }) : null;
    const reads = res ? res.reads : [];
    let refArr = null;
    if (S.fasta) { try { refArr = await S.fasta.fetch(S.contigs[S.view.refId].name, ls, le); } catch (e) { refArr = null; } }
    if (token !== S.loadToken) return;

    S.data = { refId: S.view.refId, start: ls, end: le, reads, refArr, insert: insertSizeBounds(reads),
      cov: res ? res.cov : new Uint32Array(0), total: res ? res.total : 0, sampled: res ? res.sampled : [] };
    S.stats.loadMs = performance.now() - t0;
    S.loading = false; S.selected = null; hideCard();
    if (S.bam && bamRef < 0) S.msg = { text: t('sample.noContig', { name: S.contigs[S.view.refId].name }) };

// Filters and downsampling act while reading, so changing them re-reads the window.
function reloadData() { if (!S.contigs) return; S.data = null; S.shown = null; GL.n = 0; S.selected = null; hideCard(); ensureData(); }

// ======================= Rendering =======================
let raf = 0;
function draw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
function fmtBp(n) {
  const L = NUM_LOCALE[LANG];
  if (n >= 1e6) return (n / 1e6).toLocaleString(L, { maximumFractionDigits: 2 }) + ' ' + t('unit.mb');
  if (n >= 1e3) return (n / 1e3).toLocaleString(L, { maximumFractionDigits: 1 }) + ' ' + t('unit.kb');
  return Math.round(n) + ' ' + t('unit.bp');
}
function fmtBytes(n) { return n >= 1 << 30 ? (n / (1 << 30)).toLocaleString(NUM_LOCALE[LANG], { maximumFractionDigits: 1 }) + ' GB' : Math.max(1, Math.round(n / (1 << 20))) + ' MB'; }
function fmtInt(n) { return Math.round(n).toLocaleString(NUM_LOCALE[LANG]); }

const frameTimes = [];
function render() {
  const t0 = performance.now(), tp = {};
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const rt = readsTop();
  // ---- reads (WebGL) ----
  if (GL_OK) {
    gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    if (S.shown && GL.n) {
      gl.enable(gl.SCISSOR_TEST);
      gl.scissor(0, 0, glCanvas.width, Math.max(0, Math.floor((H - rt) * DPR)));
      gl.useProgram(GL.prog); gl.bindVertexArray(GL.vao);
      gl.uniform1f(GL.u.u_viewStart, S.view.start - S.data.start);
      gl.uniform1f(GL.u.u_bpPerPx, S.view.bpPerPx);
      gl.uniform1f(GL.u.u_rowH, P.readHeight);
      gl.uniform1f(GL.u.u_gap, P.readHeight >= 5 ? 1 : 0);
      gl.uniform1f(GL.u.u_grpGap, groupGap());
      gl.uniform1f(GL.u.u_scroll, S.scroll);
      gl.uniform1f(GL.u.u_top, rt + groupGap());
      gl.uniform2f(GL.u.u_size, W, H);
      gl.uniform1f(GL.u.u_mmFade, 1.5);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, GL.n);
      gl.disable(gl.SCISSOR_TEST);
    }
  }
  let tl = performance.now(); tp.reads = tl - t0;
  const part = (k, f) => { f(); const n = performance.now(); tp[k] = n - tl; tl = n; };
  part('ruler', () => { drawRuler(); drawRefTrack(); });
  part('coverage', drawCoverage);
  part('labels', () => { drawReadsOverlay(rt); drawMessage(); });
  S.stats.drawMs = performance.now() - t0;
  S.stats.parts = tp;
  frameTimes.push(S.stats.drawMs); if (frameTimes.length > 15) frameTimes.shift();
  updateStatus();
}

function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); for (const m of [1, 2, 5, 10]) if (m * p >= raw) return m * p; return 10 * p; }

function drawRuler() {
  if (!S.contigs) return;
  const bpp = S.view.bpPerPx, step = niceStep(bpp * 110);
  ctx.fillStyle = COL.css.muted; ctx.strokeStyle = COL.css.line; ctx.lineWidth = 1;
  ctx.font = '11px ' + MONO; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'center';
  const first = Math.ceil(S.view.start / step) * step;
  ctx.beginPath();
  for (let b = first; b < viewEnd(); b += step) {
    const x = Math.round((b - S.view.start) / bpp) + 0.5;
    ctx.moveTo(x, RULER_H - 7); ctx.lineTo(x, RULER_H);
    const lbl = fmtInt(b + 1), tw = ctx.measureText(lbl).width / 2;
    ctx.fillText(lbl, Math.min(W - tw - 2, Math.max(tw + 2, x)), RULER_H - 10);
  }
  ctx.moveTo(0, RULER_H + 0.5); ctx.lineTo(W, RULER_H + 0.5);
  ctx.stroke();
  // sort position
  if (S.sortPos != null && P.sortBy !== 'start') {
    const x0 = (S.sortPos - S.view.start) / bpp, x1 = (S.sortPos + 1 - S.view.start) / bpp;
    ctx.strokeStyle = COL.css.accent; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(Math.round(x0) + 0.5, RULER_H); ctx.lineTo(Math.round(x0) + 0.5, H);
    if (x1 - x0 > 3) { ctx.moveTo(Math.round(x1) - 0.5, RULER_H); ctx.lineTo(Math.round(x1) - 0.5, H); }
    ctx.stroke(); ctx.setLineDash([]);
  }
}

function drawRefTrack() {
  const d = S.data; if (!d) return;
  const bpp = S.view.bpPerPx, ppb = 1 / bpp, y = RULER_H + 2;
  if (ppb < 1.2) return;
  const b0 = Math.max(d.start, Math.floor(S.view.start)), b1 = Math.min(d.end, Math.ceil(viewEnd()));
  ctx.textAlign = 'center'; ctx.font = '600 11px ' + MONO;
  for (let b = b0; b < b1; b++) {
    const c = d.refArr[b - d.start]; if (!c) continue;
    const x = (b - S.view.start) * ppb;
    if (ppb >= 8) { ctx.fillStyle = COL.baseCss[c] || COL.css.muted; ctx.fillText(String.fromCharCode(c), x + ppb / 2, y + 10); }
    else { ctx.fillStyle = COL.baseCss[c] || COL.css.muted; ctx.fillRect(x, y + 2, Math.max(1, ppb - (ppb > 3 ? 1 : 0)), REF_H - 6); }
  }
}

function drawCoverage() {
  const sh = S.shown, d = S.data; if (!sh || !d || !S.bam) return;
  const top = covTop(), h = P.coverage.height, bpp = S.view.bpPerPx, ppb = 1 / bpp;
  const cov = sh.cov, thr = P.coverage.alleleThreshold;
  const b0 = Math.max(d.start, Math.floor(S.view.start)), b1 = Math.min(d.end, Math.ceil(viewEnd()));
  let maxD = 1;
  for (let b = b0; b < b1; b++) { const j = (b - d.start) * 6; const t = cov[j] + cov[j + 1] + cov[j + 2] + cov[j + 3] + cov[j + 4] + cov[j + 5]; if (t > maxD) maxD = t; }
  const scale = (h - 10) / maxD, base = top + h;
  const flagged = (j) => flaggedPos(cov, d, d.start + j / 6);
  const drawStack = (x, w, j) => {
    let y = base;
    for (const [k, c] of [[0, 65], [1, 67], [2, 71], [3, 84]]) { const hh = cov[j + k] * scale; if (hh > 0) { ctx.fillStyle = COL.baseCss[c]; ctx.fillRect(x, y - hh, w, hh); y -= hh; } }
  };
  if (ppb >= 1) {
    for (let b = b0; b < b1; b++) {
      const j = (b - d.start) * 6, x = (b - S.view.start) * ppb, w = Math.max(1, ppb - (ppb > 4 ? 1 : 0));
      if (flagged(j)) drawStack(x, w, j);
      else { const t = cov[j] + cov[j + 1] + cov[j + 2] + cov[j + 3] + cov[j + 4]; ctx.fillStyle = COL.css.cov; ctx.fillRect(x, base - t * scale, w, t * scale); }
    }
  } else {
    for (let px = 0; px < W; px++) {
      const s = Math.floor(S.view.start + px * bpp), e = Math.floor(S.view.start + (px + 1) * bpp);
      let mx = 0, fj = -1;
      for (let b = Math.max(s, d.start); b < Math.min(Math.max(e, s + 1), d.end); b++) {
        const j = (b - d.start) * 6, t = cov[j] + cov[j + 1] + cov[j + 2] + cov[j + 3] + cov[j + 4];
        if (t > mx) mx = t;
        if (fj < 0 && flagged(j)) fj = j;
      }
      if (fj >= 0) drawStack(px, 1, fj); else if (mx) { ctx.fillStyle = COL.css.cov; ctx.fillRect(px, base - mx * scale, 1, mx * scale); }
    }
  }
  ctx.fillStyle = COL.css.muted; ctx.font = '10.5px ' + MONO; ctx.textAlign = 'left';
  ctx.fillText('0–' + fmtInt(maxD) + '×', 6, top + 10);
  ctx.strokeStyle = COL.css.line; ctx.beginPath(); ctx.moveTo(0, base + 3.5); ctx.lineTo(W, base + 3.5); ctx.stroke();
}

function drawReadsOverlay(rt) {
  const sh = S.shown; if (!sh) return;
  ctx.save(); ctx.beginPath(); ctx.rect(0, rt, W, H - rt); ctx.clip();
  const rh = P.readHeight, gg = groupGap(), bpp = S.view.bpPerPx, ppb = 1 / bpp, d = S.data;
  // group labels
  if (gg) sh.groups.forEach((g, gi) => {
    const y = rt + g.start * rh + gi * gg - S.scroll + gg;
    ctx.strokeStyle = COL.css.line; ctx.beginPath(); ctx.moveTo(0, Math.round(y - gg + 3) + 0.5); ctx.lineTo(W, Math.round(y - gg + 3) + 0.5); ctx.stroke();
    ctx.font = '600 11px ' + SANS; ctx.textAlign = 'left'; ctx.fillStyle = COL.css.fg;
    ctx.fillText(g.key + '  ·  ' + fmtInt(g.count), 8, y - 6);
  });

  if (ppb >= 7 && rh >= 9) {
    ctx.font = '600 ' + Math.min(12, rh - 1) + 'px ' + MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const vs = S.view.start, ve = viewEnd();
    sh.groups.forEach((g, gi) => {
      const firstRow = Math.max(0, Math.floor((S.scroll - gi * gg) / rh) - g.start - 1);
      const lastRow = Math.min(g.rows.length - 1, Math.ceil((S.scroll + H - rt - gi * gg) / rh) - g.start + 1);
      for (let ri = firstRow; ri <= lastRow; ri++) {
        const y = rt + gg + (g.start + ri) * rh + gi * gg - S.scroll + (rh - (rh >= 5 ? 1 : 0)) / 2;
        for (const rec of g.rows[ri]) {
          if (rec.end < vs || rec.pos > ve) continue;
          const a = mapqAlpha(rec.mapq);
          for (const f of feats(rec)) {
            if (f.t === 0) { ctx.globalAlpha = a * qualAlpha(f.q); ctx.fillStyle = '#fff'; ctx.fillText(String.fromCharCode(f.b), (f.pos - vs + 0.5) * ppb, y + 0.5); }

        }

  }
  // where reads were left out by downsampling (IGV draws the same marks)
  if (d.sampled && d.sampled.length) {
    ctx.fillStyle = COL.css.fg; ctx.globalAlpha = 0.55;
    for (const [a, b] of d.sampled) {
      if (b < S.view.start || a > viewEnd()) continue;
      const x0 = (a - S.view.start) * ppb, x1 = (b - S.view.start) * ppb;
      ctx.fillRect(x0 + (x1 - x0 > 3 ? 0.5 : 0), rt + 0, Math.max(1, x1 - x0 - (x1 - x0 > 3 ? 1 : 0)), 3);
    }
    ctx.globalAlpha = 1;
  }
  // selected read
  if (S.selected) {
    const L = S.selected;
    const y = rt + gg + L.row * rh + L.gi * gg - S.scroll;
    const x0 = (L.rec.pos - S.view.start) * ppb, x1 = (L.rec.end - S.view.start) * ppb;

// ======================= Locus =======================
function syncLocus() {
  if (!S.contigs || document.activeElement === $('locus')) return;
  const s = Math.max(0, Math.round(S.view.start)), e = Math.min(refLen(), Math.round(viewEnd()));
  $('locus').value = `${S.contigs[S.view.refId].name}:${fmtInt(s + 1)}-${fmtInt(e)}`;
  $('span').textContent = fmtBp(e - s);
}
function parseLocus(str) {
  str = str.trim().replace(/[  \s]/g, '').replace(/[–—]/g, '-');
  const m = str.match(/^([^:]+?)(?::([\d,.]+)(?:-([\d,.]+))?)?$/);
  if (!m) return null;
  const id = contigId(m[1]); if (id < 0) return { error: t('locus.noContig', { name: m[1] }) };
  const num = x => parseInt(x.replace(/[,.]/g, ''), 10);
  const L = S.contigs[id].len;
  if (!m[2]) return { id, s: 0, e: L };
  const a = num(m[2]) - 1;
  if (!m[3]) return { id, s: a - 50, e: a + 51, center: a };
  return { id, s: a, e: num(m[3]) };
}

let drag = null;

const onCanvas = e => e.target === ov;
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !S.contigs || !onCanvas(e)) return;
  stage.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, y: e.clientY, sx: S.view.start, sc: S.scroll, moved: false, inReads: e.offsetY > readsTop() };
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  if (!drag.moved) return;
  S.view.start = drag.sx - dx * S.view.bpPerPx; clampView();
  if (drag.inReads) { S.scroll = drag.sc - dy; clampScroll(); }

});
stage.addEventListener('pointerup', e => {

stage.addEventListener('dblclick', e => { if (S.contigs && onCanvas(e)) zoomAt(e.offsetX, 0.5); });

  if (e.ctrlKey || e.metaKey) { zoomAt(e.offsetX, Math.exp(dy * 0.01)); return; }

function hitTest(x, y) {
  const sh = S.shown; if (!sh) return null;
  const rt = readsTop(), rh = P.readHeight, gg = groupGap();
  if (y < rt) return null;
  for (let gi = 0; gi < sh.groups.length; gi++) {
    const g = sh.groups[gi];
    const gy = rt + gg + g.start * rh + gi * gg - S.scroll;
    const ri = Math.floor((y - gy) / rh);
    if (ri < 0 || ri >= g.rows.length) continue;
    const bp = S.view.start + x * S.view.bpPerPx, slop = 2 * S.view.bpPerPx;
    const row = g.rows[ri];
    let lo = 0, hi = row.length - 1, best = null;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (row[m].pos <= bp + slop) { best = m; lo = m + 1; } else hi = m - 1; }
    for (let k = best; k != null && k >= 0 && k >= best - 3; k--) if (row[k].end + slop > bp) return { rec: row[k], row: g.start + ri, gi };
  }
  return null;
}

function onClick(x, y) {
  const h = hitTest(x, y);
  if (!h) { S.selected = null; hideCard(); draw(); return; }
  S.selected = h; showCard(h.rec, x, y); draw();
}

const FLAG_BITS = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048];
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    [t('card.name'), rec.name], [t('card.pos'), `${refs[rec.refID].name}:${fmtInt(rec.pos + 1)}-${fmtInt(rec.end)}`], ['CIGAR', cigarString(rec)],
    ['MAPQ', rec.mapq], [t('card.flag'), `${rec.flag} (${FLAG_BITS.filter(b => rec.flag & b).map(b => t('flag.' + b)).join(', ') || '—'})`],

}

document.addEventListener('keydown', e => {

function resize() {

  DPR = Math.min(window.devicePixelRatio || 1, 3);
  const oldW = W; W = Math.max(1, r.width); H = Math.max(1, r.height);
  for (const c of [glCanvas, ov]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  if (oldW && S.contigs) { const c = S.view.start + oldW * S.view.bpPerPx / 2; S.view.start = c - W * S.view.bpPerPx / 2; clampView(); }

// Opens a sample. With a reference loaded, the sample's contigs are matched to the reference's
// (name variants, then unique length); without one, the sample's own header gives the coordinates.
async function openBam(bamSrc, baiSrc, opts) {
  opts = opts || {};
  S.loadToken++; S.loading = true; S.msg = null; draw();
  try {
    const bam = await new BamFile(bamSrc, baiSrc).open();
    const back = new Int32Array(bam.refs.length).fill(-1);
    let map, note = '';
    if (S.fasta) {
      const link = matchContigs(bam.refs, S.contigs);
      if (!link.matched.length) {
        S.loading = false; draw();
        const list = (arr, n) => arr.slice(0, n).map(x => `${x.name} (${fmtInt(x.len)} ${t('unit.bp')})`).join(', ') + (arr.length > n ? ` … +${fmtInt(arr.length - n)}` : '');
        toast(t('sample.mismatch', { name: bamSrc.name, bam: list(bam.refs, 3), ref: list(S.contigs, 3) }), true);
        return false;
      }
      const viewIdx = new Map(S.contigs.map((c, i) => [c.name, i])), bamIdx = new Map(bam.refs.map((r, i) => [r.name, i]));
      map = new Int32Array(S.contigs.length).fill(-1);
      for (const [b, f] of link.matched) { map[viewIdx.get(f)] = bamIdx.get(b); back[bamIdx.get(b)] = viewIdx.get(f); }
      const byLen = link.matched.filter(m => m[2] === 'length');
      if (byLen.length) note += t('sample.byLength', { pairs: byLen.slice(0, 3).map(m => m[0] + ' = ' + m[1]).join(', ') + (byLen.length > 3 ? ' …' : '') }) + ' ';
      if (link.unmatched.length) note += t('sample.partial', { n: fmtInt(link.unmatched.length), names: link.unmatched.slice(0, 3).join(', ') + (link.unmatched.length > 3 ? ' …' : '') });
    } else {
      S.contigs = bam.refs.map(r => ({ name: r.name, len: r.len })); S._ck = null;
      map = Int32Array.from(bam.refs, (r, i) => i); back.forEach((v, i) => { back[i] = i; });
    }
    const keepView = !!S.fasta && S.viewSet && map[S.view.refId] >= 0;
    S.bam = bam; S.bamMap = map; S.bamBack = back;
    S.data = null; S.shown = null; GL.n = 0; S.isDemo = !!opts.demo; S.sortPos = null; S.selected = null; hideCard();
    S.bamName = bamSrc.name; updateFileLabel();
    $('examples').hidden = !S.isDemo;
    S.loading = false;
    if (note) toast(note.trim(), note.length > 90);
    const loc = opts.locus ? parseLocus(opts.locus) : null;
    if (loc && !loc.error) goto(loc.id, loc.s, loc.e);
    else if (keepView) { S.data = null; requestLoad(); draw(); }
    else { const i = Math.max(0, map.findIndex(x => x >= 0)); goto(i, 0, Math.min(S.contigs[i].len, 10000)); }
    S.viewSet = true;
    return true;
  } catch (e) {
    S.loading = false; S.msg = { text: errText(e), error: true }; draw();
    return false;
  }
}
function updateFileLabel() {
  const parts = [];
  if (S.fasta) parts.push(S.fasta.name);
  if (S.bam) parts.push(S.bamName + (S.bam.samples.length ? ' · ' + S.bam.samples.join(', ') : ''));
  $('fileName').textContent = parts.join('  ·  ');
}

function b64ToBlob(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u]); }
async function openDemo() {

  if (ok) openBam(new FileSource(b64ToBlob(DEMO.bam), 'demo.bam'), new FileSource(b64ToBlob(DEMO.bai), 'demo.bam.bai'), { demo: true, locus: 'demo:11,941-12,060' });
}

function openLocalFiles(files) {
  const by = ext => [...files].find(f => f.name.toLowerCase().endsWith(ext));
  const cram = by('.cram');
  if (cram) { toast(t('files.cram')); return; }
  const bam = by('.bam'), bai = by('.bai');
  const ref = pickRefFiles(files);
  if (!bam && ref) { openReference(ref); return; }
  if (by('.csi') && !bai) { toast(t('files.csi')); return; }
  if (!bam || !bai) { toast(t('files.needPair')); return; }
  closePanels();
  // a reference chosen together with the sample is loaded first; the sample is then matched to it
  (ref ? openReference(ref, { noGoto: true }) : Promise.resolve(true)).then(ok => { if (ok) openBam(new FileSource(bam), new FileSource(bai)); });
}

function openUrls() {

// ======================= Reference =======================
// Public assemblies hosted by the IGV team on S3 (CORS enabled); same list igv.js uses.
const REF_PRESETS = {
  hg38: { label: 'GRCh38 / hg38', fa: 'https://igv-genepattern-org.s3.amazonaws.com/genomes/seq/hg38/hg38.fa' },
  hg19: { label: 'GRCh37 / hg19', fa: 'https://igv-genepattern-org.s3.amazonaws.com/genomes/seq/hg19/hg19.fasta' },
  chm13: { label: 'T2T-CHM13 v2.0', fa: 'https://s3.amazonaws.com/igv.org.genomes/chm13v2.0/chm13v2.0.fa' },
};
function pickRefFiles(files) {
  const L = f => f.name.toLowerCase();
  const fa = [...files].find(f => /\.(fa|fasta|fna)(\.gz)?$/.test(L(f)));
  if (!fa) return null;
  const fai = [...files].find(f => L(f).endsWith('.fai')) || null;
  const gzi = [...files].find(f => L(f).endsWith('.gzi')) || null;
  return { fa: new FileSource(fa), fai: fai ? new FileSource(fai) : null, gzi: gzi ? new FileSource(gzi) : null, size: fa.size };
}
// ref = { fa, fai?, gzi?, size? } — sources. Without a .fai (or a .fa.gz without .gzi)
// the FASTA is indexed here in one pass, with progress.
let refBusy = false;
// Loading a reference switches the genome: samples opened against the previous one are closed.
async function openReference(ref, opts) {
  opts = opts || {};
  if (refBusy) return false;
  refBusy = true;
  const name = ref.fa.name, gz = /\.gz$/i.test(name);
  try {
    let fasta = null;
    if (ref.fai && (!gz || ref.gzi)) {
      try { fasta = await new IndexedFasta(ref.fa, ref.fai, ref.gzi).open(); }
      catch (e) { if (!(ref.fa instanceof UrlSource) || !['notfound', 'http', 'auth', 'network'].includes(e.code) || e.vars.name === name) throw e; fasta = null; }
    }
    if (!fasta) {
      const fmt = n => n >= 1 << 30 ? (n / (1 << 30)).toFixed(1) + ' GB' : (n / (1 << 20)).toFixed(0) + ' MB';
      toast(t('ref.indexing', { name, done: '0%' }), true);
      fasta = await new IndexedFasta(ref.fa).openUnindexed(ref.size, (done, total) =>
        toast(t('ref.indexing', { name, done: total ? Math.min(100, Math.round(done / total * 100)) + '%' : fmt(done) }), true));
    }
    const closed = !!S.bam;
    S.loadToken++;
    S.fasta = fasta; S.contigs = [...fasta.idx].map(([n, e]) => ({ name: n, len: e.len })); S._ck = null;
    S.bam = null; S.bamMap = null; S.bamBack = null; S.bamName = '';
    S.data = null; S.shown = null; GL.n = 0; S.selected = null; S.sortPos = null; S.isDemo = false; S.msg = null; S.loading = false;
    hideCard(); updateRefInfo(); updateFileLabel(); $('examples').hidden = true; closePanels();
    if (!opts.quiet) {
      let note = fasta.built ? t('ref.indexed', { name, n: fmtInt(fasta.idx.size) }) : t('ref.loaded', { name });
      if (closed) note += ' ' + t('ref.closedSamples');
      toast(note, note.length > 90);
    }
    // a new genome means a new coordinate system: the old view no longer applies
    S.view.refId = 0; S.view.start = 0; S.viewSet = false;
    if (!opts.noGoto) { goto(0, 0, Math.min(S.contigs[0].len, 1000)); S.viewSet = true; }
    return true;
  } catch (e) { toast(t('ref.failed', { msg: errText(e) })); return false; }
  finally { refBusy = false; }
}
function updateRefInfo() {
  const el = $('refInfo'); if (!el) return;
  el.textContent = S.fasta ? t('ref.current', { name: S.fasta.name }) : t('ref.none');
}
$('pickRef').onchange = e => { const r = pickRefFiles(e.target.files); e.target.value = ''; if (!r) { toast(t('ref.failed', { msg: t('err.faEmpty') })); return; } openReference(r); };
$('refPreset').onchange = e => { const p = REF_PRESETS[e.target.value]; if (p) $('refUrl').value = p.fa; };
$('loadRef').onclick = () => {
  const u = $('refUrl').value.trim(); if (!u) return;
  const gz = /\.gz(\?|$)/i.test(u);
  openReference({ fa: new UrlSource(u), fai: new UrlSource(addSuffix(u, '.fai')), gzi: gz ? new UrlSource(addSuffix(u, '.gzi')) : null });
};

$('locus').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !S.contigs) return;
  const l = parseLocus(e.target.value);
  if (!l) { toast(t('locus.bad')); return; }
  if (l.error) { toast(l.error); return; }
  e.target.blur(); goto(l.id, l.s, l.e);
});
$('examples').onchange = e => { const v = e.target.value; e.target.value = ''; if (!v || !S.contigs) return; const l = parseLocus(v); if (l && !l.error) goto(l.id, l.s, l.e); };

// profile controls: id → [profile path, type, what to recompute]
const CONTROLS = [
  ['readHeight', 'readHeight', 'num', 'draw'],
  ['colorBy', 'colorBy', 'str', 'rebuild'], ['colorTag', 'colorTag', 'str', 'rebuild'],
  ['groupBy', 'groupBy', 'str', 'rebuild'], ['groupTag', 'groupTag', 'str', 'rebuild'],
  ['sortBy', 'sortBy', 'str', 'rebuild'],
  ['mqLow', 'mapqAlpha.low', 'num', 'rebuild'], ['mqHigh', 'mapqAlpha.high', 'num', 'rebuild'], ['mqMinAlpha', 'mapqAlpha.minAlpha', 'num', 'rebuild'],
  ['bqShade', 'baseQualityShading', 'bool', 'rebuild'], ['softClips', 'showSoftClips', 'bool', 'rebuild'],
  ['minMapq', 'filters.minMapq', 'num', 'reload'], ['hideDup', 'filters.hideDuplicates', 'bool', 'reload'],
  ['hideSec', 'filters.hideSecondary', 'bool', 'reload'], ['hideSupp', 'filters.hideSupplementary', 'bool', 'reload'], ['hideQc', 'filters.hideQcFail', 'bool', 'reload'],
  ['dsOn', 'downsample.enabled', 'bool', 'reload'], ['dsMax', 'downsample.maxReads', 'num', 'reload'], ['dsWin', 'downsample.window', 'num', 'reload'],
  ['covHeight', 'coverage.height', 'num', 'draw'], ['alleleThr', 'coverage.alleleThreshold', 'num', 'rebuild'],
  ['hideToolbar', 'hideToolbar', 'bool', 'chrome'], ['language', 'language', 'str', 'lang'],
];
const getPath = (o, p) => p.split('.').reduce((a, k) => a[k], o);
const setPath = (o, p, v) => { const ks = p.split('.'), last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
function syncPanel() {
  for (const [id, path, type] of CONTROLS) { const el = $(id); if (!el) continue; const v = getPath(P, path); if (type === 'bool') el.checked = v; else el.value = v; }
  $('readHeightOut').textContent = (+P.readHeight).toFixed(1) + ' px';
  $('mqMinAlphaOut').textContent = Math.round(P.mapqAlpha.minAlpha * 100) + '%';
  $('alleleThrOut').textContent = Math.round(P.coverage.alleleThreshold * 100) + '%';
  $('covHeightOut').textContent = P.coverage.height + ' px';
  $('colorTagRow').hidden = P.colorBy !== 'tag'; $('groupTagRow').hidden = P.groupBy !== 'tag';
  $('profileJson').value = JSON.stringify(P, null, 2);
  updateMqLegend();
}
function updateMqLegend() {
  const el = $('mqLegend'); if (!el) return;
  el.style.background = `linear-gradient(90deg, rgb(${COL.read} / ${P.mapqAlpha.minAlpha}), rgb(${COL.read} / 1))`;
  $('mqLegendLo').textContent = 'MQ ≤ ' + P.mapqAlpha.low; $('mqLegendHi').textContent = 'MQ ≥ ' + P.mapqAlpha.high;
}
let rebuildTimer = 0;
for (const [id, path, type, effect] of CONTROLS) {
  const el = $(id); if (!el) continue;
  el.addEventListener(type === 'bool' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
    let v = type === 'bool' ? el.checked : type === 'num' ? parseFloat(el.value) : el.value.trim();
    if (type === 'num' && !isFinite(v)) return;
    setPath(P, path, v); saveProfile(); syncPanel();
    if (effect === 'draw') { clampScroll(); draw(); }
    else if (effect === 'chrome') applyChrome();
    else if (effect === 'lang') applyLanguage();
    else if (effect === 'reload') { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(reloadData, 250); }
    else { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(() => { if (id === 'sortBy' && S.sortPos == null) S.sortPos = Math.floor(viewCenter()); rebuild(); draw(); }, 30); }
  });
}
$('sortHere').onclick = sortHere;
$('copyProfile').onclick = () => navigator.clipboard.writeText(JSON.stringify(P, null, 2)).then(() => toast(t('profile.copied')), () => { $('profileJson').select(); toast(t('copyFail')); });
$('applyProfile').onclick = () => {
  try { P = mergeProfile(DEFAULT_PROFILE, JSON.parse($('profileJson').value)); saveProfile(); applyLanguage(); syncPanel(); applyChrome(); rebuild(); draw(); toast(t('profile.applied')); }
  catch (e) { toast(t('profile.bad', { msg: e.message })); }
};
$('resetProfile').onclick = () => { P = clone(DEFAULT_PROFILE); saveProfile(); applyLanguage(); syncPanel(); applyChrome(); rebuild(); draw(); toast(t('profile.reset')); };
$('showToolbar').onclick = () => { P.hideToolbar = false; saveProfile(); applyChrome(); };
function applyChrome() { document.body.classList.toggle('bare', P.hideToolbar); $('showToolbar').hidden = !P.hideToolbar; requestAnimationFrame(resize); }

let toastTimer = 0;
$('toast').onclick = () => { $('toast').hidden = true; };
function toast(msg, sticky) { const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); if (!sticky) toastTimer = setTimeout(() => el.hidden = true, msg.length > 90 ? 7000 : 3500); }

// ======================= Theme =======================
function onTheme() { readColors(); if (S.data) rebuild(); draw(); updateMqLegend(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ======================= Start =======================
const SANS = getComputedStyle(document.documentElement).getPropertyValue('--sans') || 'system-ui, sans-serif';
const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono') || 'ui-monospace, monospace';
LANG = STRINGS[P.language] ? P.language : 'en';
buildLanguageSelect(); applyI18n(); readColors(); syncPanel(); applyChrome(); updateRefInfo();
if (!GL_OK) { $('msg').hidden = false; $('msg').className = 'msg err'; $('msg').textContent = t('nowebgl'); }
else { warmUpGL(); if (GL_SOFTWARE) setTimeout(() => toast(t('gl.software')), 1500); }
openDemo();

</script>
