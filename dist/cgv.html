<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https: http://localhost:* http://127.0.0.1:*; worker-src blob:">
<style>body{margin:0}</style>
</head>
<body>
<title>CGV Genome Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="CGV — a fast in-browser viewer for BAM alignments">
<style>
/* Data fills the screen; the UI is one thin bar on top plus slide-in panels. */
:root {
  --bg: #fafbfb; --panel: #ffffff; --fg: #1b1f24; --muted: #6a717b; --line: #e2e5e9; --accent: #0b6e8a;
  --read: #b9bec6; --read-fwd: #d8a9a6; --read-rev: #9fb5d6; --cov: #a8aeb7;
  --del: #2a2e34; --ins: #7a3fd0; --clip: #d23f8a;
  --pair-large: #d0453c; --pair-small: #3b6fd4; --pair-rf: #3d9a5c; --pair-ff: #1e9aa3; --pair-unmapped: #d49a1a;
  --base-a: #1e9a4e; --base-c: #2a5fd6; --base-g: #d48a0f; --base-t: #d0362f;
  --cat-1: #d0453c; --cat-2: #3b6fd4; --cat-3: #3d9a5c; --cat-4: #b05fc7; --cat-5: #d49a1a; --cat-6: #1e9aa3; --cat-7: #8a6a4a; --cat-8: #c95f8f;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --bar-h: 40px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --panel: #1a1d21; --fg: #e3e6ea; --muted: #959ca6; --line: #2a2f35; --accent: #4cb4d4;
  --read: #4e555e; --read-fwd: #7d5654; --read-rev: #4d6283; --cov: #69717b;
  --del: #dfe3e8; --ins: #a77bf0; --clip: #ec6aac;
  --pair-large: #e8665d; --pair-small: #6d96ec; --pair-rf: #5cbf7c; --pair-ff: #3cc0c8; --pair-unmapped: #e8b542;
  --base-a: #3cc06e; --base-c: #5a89f0; --base-g: #f0a73a; --base-t: #f0605a;
  --cat-1: #e8665d; --cat-2: #6d96ec; --cat-3: #5cbf7c; --cat-4: #c98ae0; --cat-5: #e8b542; --cat-6: #3cc0c8; --cat-7: #b8916b; --cat-8: #e486b1;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121417; --panel: #1a1d21; --fg: #e3e6ea; --muted: #959ca6; --line: #2a2f35; --accent: #4cb4d4;
  --read: #4e555e; --read-fwd: #7d5654; --read-rev: #4d6283; --cov: #69717b;
  --del: #dfe3e8; --ins: #a77bf0; --clip: #ec6aac;
  --pair-large: #e8665d; --pair-small: #6d96ec; --pair-rf: #5cbf7c; --pair-ff: #3cc0c8; --pair-unmapped: #e8b542;
  --base-a: #3cc06e; --base-c: #5a89f0; --base-g: #f0a73a; --base-t: #f0605a;
  --cat-1: #e8665d; --cat-2: #6d96ec; --cat-3: #5cbf7c; --cat-4: #c98ae0; --cat-5: #e8b542; --cat-6: #3cc0c8; --cat-7: #b8916b; --cat-8: #e486b1;
  color-scheme: dark; }

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--sans); overflow: hidden; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.bar { height: var(--bar-h); flex: none; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); background: var(--bg); min-width: 0; }
body.bare .bar { display: none; }
.mark { font: 700 13px/1 var(--mono); letter-spacing: .06em; color: var(--accent); flex: none; }
.locus { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 0 1 330px; }
#locus { width: 100%; min-width: 0; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
#span { color: var(--muted); font: 11.5px var(--mono); white-space: nowrap; }
.btn { height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
select.btn { padding-right: 4px; flex: none; max-width: 170px; }
.file { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
.status { color: var(--muted); font: 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
@media (max-width: 900px) { .status, .file { display: none; } }
@media (max-width: 560px) { #span, #examples { display: none; } .locus { flex-basis: 200px; } }

#stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#stage:active { cursor: grabbing; }
#stage.drop::after { content: attr(data-drop-text); position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 10px; display: grid; place-items: center; color: var(--accent); font-weight: 600; background: color-mix(in srgb, var(--bg) 80%, transparent); }
#gl, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.msg { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); max-width: min(520px, calc(100% - 32px)); padding: 10px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 24px rgb(0 0 0 / .08); text-align: center; }
.msg.err { border-color: var(--pair-large); }
.spin { display: inline-block; width: 11px; height: 11px; margin-right: 8px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.card { position: absolute; z-index: 5; width: min(380px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgb(0 0 0 / .14); padding: 8px 10px; cursor: auto; user-select: text; -webkit-user-select: text; }
.card dl { display: grid; grid-template-columns: max-content 1fr; gap: 0 10px; margin: 0; font-size: 11.5px; line-height: 1.3; }
.card dt.hl, .card dd.hl { font-weight: 600; color: var(--fg); }
.card dd.hl + dt:not(.hl) { margin-top: 4px; } .card dd.hl + dt:not(.hl) + dd { margin-top: 4px; }
.card dt { color: var(--muted); }
.card dd { margin: 0; font-family: var(--mono); font-size: 11px; word-break: break-all; min-width: 0; }
.ctx { position: absolute; z-index: 8; min-width: 230px; max-height: calc(100% - 16px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgb(0 0 0 / .16); padding: 4px; display: flex; flex-direction: column; cursor: auto; }
.mi { display: flex; align-items: center; gap: 6px; text-align: left; border: 0; background: none; padding: 4px 10px 4px 6px; border-radius: 5px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.mi:hover, .mi:focus-visible { background: color-mix(in srgb, var(--accent) 14%, transparent); outline: none; }
.mk { width: 14px; flex: none; text-align: center; color: var(--accent); font-size: 11px; }
.ms { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 3px 26px; border-top: 1px solid var(--line); margin-top: 4px; }
.mt { display: flex; align-items: center; gap: 8px; padding: 2px 10px 4px 26px; font-size: 12px; color: var(--muted); }
.mt input { width: 46px; height: 24px; padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); font-family: var(--mono); }
.card.wide { width: min(760px, calc(100% - 16px)); }
.card .cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 0 20px; }
.card .col h3 { font-size: 12.5px; margin: 2px 0 3px; font-weight: 700; }
.card .ln { font-size: 12px; line-height: 1.32; overflow-wrap: anywhere; }
.card .ln.b { font-weight: 600; }
.card .sep { border-top: 1px dashed var(--line); margin: 3px 0; }
.card .loc { border-top: 1px solid var(--muted); margin-top: 5px; padding-top: 3px; }
.card .seg { display: inline-flex; margin-bottom: 6px; }
.card .seg .btn { height: 24px; font-size: 12px; border-radius: 0; }
.card .seg .btn:first-child { border-radius: 6px 0 0 6px; } .card .seg .btn:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
.card .seg .btn.on { border-color: var(--accent); color: var(--accent); position: relative; }
.card-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

.side { position: absolute; z-index: 10; top: var(--bar-h); right: 0; bottom: 0; width: min(330px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 28px rgb(0 0 0 / .08); overflow: auto;
  padding-block: 12px 24px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.side header { display: flex; align-items: center; justify-content: space-between; }
.side header h1 { font-size: 14px; margin: 0; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; margin-bottom: 10px; }
.field label { font-size: 12.5px; }
.field output { font: 11.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.field input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.field select, .field input[type=text], .field input[type=number], .field input[type=url], .field input[type=password] { grid-column: 1 / -1; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); min-width: 0; width: 100%; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.field > *, .pair > * { min-width: 0; }
.pair .field input { grid-column: 1 / -1; }
.check { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12.5px; }
.check input { accent-color: var(--accent); }
.legend { height: 10px; border-radius: 3px; border: 1px solid var(--line); }
.legend-labels { display: flex; justify-content: space-between; font: 10.5px var(--mono); color: var(--muted); margin-top: 3px; }
.hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
textarea { width: 100%; min-height: 140px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font: 11px/1.45 var(--mono); padding: 8px; resize: vertical; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.field textarea.links { grid-column: 1 / -1; min-height: 52px; font: 12px/1.4 var(--mono); }
.folder-list { margin-top: 10px; display: grid; gap: 4px; }
.folder-list .chk { display: flex; gap: 8px; align-items: center; font: 12px var(--mono); overflow-wrap: anywhere; }
.drop-zone { display: grid; place-items: center; gap: 6px; padding: 18px 12px; border: 1.5px dashed var(--line); border-radius: 8px; text-align: center; color: var(--muted); cursor: pointer; }
.drop-zone:hover { border-color: var(--accent); color: var(--fg); }
.drop-zone strong { color: var(--fg); }
.drop-zone span { display: block; }
.ref-info { color: var(--fg); margin: 0 0 8px; }
.keys { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; font-size: 12px; margin: 0; }
.keys dt { font-family: var(--mono); color: var(--muted); }
.keys dd { margin: 0; }

.toast-x { margin-left: 10px; border: 0; background: none; color: inherit; font-size: 15px; line-height: 1; cursor: pointer; opacity: .75; padding: 0 2px; }
.toast-x:hover { opacity: 1; }
.toast { position: fixed; z-index: 20; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 12.5px; max-width: min(720px, calc(100% - 32px)); cursor: pointer; overflow-wrap: anywhere; }
#showToolbar { position: absolute; z-index: 6; top: max(6px, env(safe-area-inset-top, 0px)); right: max(6px, env(safe-area-inset-right, 0px)); opacity: .7; }
#showToolbar:hover { opacity: 1; }
body.bare .side { top: 0; }
</style>

<header class="bar">
  <span class="mark" title="Convenient, custom, genomic viewer">CGV</span>
  <div class="locus">
    <input id="locus" type="text" spellcheck="false" autocomplete="off" data-i18n-aria="locus.aria" aria-label="Locus: contig:start-end" placeholder="chr7:117,559,500-117,560,000">
    <span id="span"></span>
  </div>
  <select id="examples" class="btn" data-i18n-aria="examples" aria-label="Examples" hidden>
    <option value="" data-i18n="examples">Examples</option>
    <option value="demo:11,941-12,060" data-i18n="ex.hetSnv">SNV, heterozygous</option>
    <option value="demo:14,941-15,060" data-i18n="ex.homSnv">SNV, homozygous</option>
    <option value="demo:17,941-18,062" data-i18n="ex.del3">3 bp deletion</option>
    <option value="demo:20,941-21,060" data-i18n="ex.ins3">3 bp insertion</option>
    <option value="demo:24,201-28,800" data-i18n="ex.del3k">3 kb deletion</option>
    <option value="demo:29,601-34,000" data-i18n="ex.repeat">Segmental duplication, MAPQ 0</option>
    <option value="demo:21,601-22,500" data-i18n="ex.chim">Mates on another contig</option>
    <option value="demo:1-40,000" data-i18n="ex.whole">Whole contig</option>
  </select>
  <span class="file" id="fileName"></span>
  <span class="status" id="status"></span>
  <button class="btn" id="openBtn" aria-expanded="false" aria-controls="openPanel" data-i18n="btn.open">Open</button>
  <button class="btn" id="viewBtn" aria-expanded="false" aria-controls="panel" data-i18n="btn.view">View</button>
</header>

<main id="stage" data-i18n-drop="drop" data-drop-text="Drop .bam and .bai files">
  <canvas id="gl"></canvas>
  <canvas id="ov"></canvas>
  <div id="msg" class="msg" hidden></div>
  <div id="card" class="card" hidden></div>
  <div id="ctx" class="ctx" role="menu" hidden></div>
  <button class="btn" id="showToolbar" hidden data-i18n="btn.toolbar">Toolbar (H)</button>

  <aside id="openPanel" class="side" hidden data-i18n-aria="open.title" aria-label="Open data">
    <header><h1 data-i18n="open.title">Open data</h1><button class="btn ghost" data-close data-i18n="btn.close">Close</button></header>
    <section>
      <h2 data-i18n="open.disk">From disk</h2>
      <label class="drop-zone" for="pickFiles"><strong data-i18n="open.pick">Choose .bam and .bai</strong><span data-i18n="open.pickSub">you can add .fa and .fai</span><span data-i18n="open.pickDrop">or drop files onto the screen</span></label>
      <input id="pickFiles" type="file" multiple accept=".bam,.bai,.fa,.fasta,.fna,.gz,.fai,.gzi" hidden>
      <div class="row-actions"><label class="btn" for="pickFolder" data-i18n="open.folder">Choose a folder</label></div>
      <input id="pickFolder" type="file" webkitdirectory multiple hidden>
      <p class="hint" data-i18n="open.indexHint"></p>
      <div id="folderList" class="folder-list" hidden></div>
      <p class="hint" data-i18n="open.diskHint">Files are read in pieces straight from disk and are never uploaded.</p>
    </section>
    <section>
      <h2 data-i18n="open.url">By link</h2>
      <div class="field"><label for="urlBam" data-i18n="open.urlBam">BAM</label><textarea id="urlBam" class="links" rows="2" spellcheck="false" autocomplete="off" placeholder="https://…/sample.bam"></textarea></div>
      <div class="field"><label for="urlBai" data-i18n="open.urlBai">Index (if not next to the BAM)</label><input id="urlBai" type="url" data-i18n-ph="open.urlBaiPh" placeholder="default: link + .bai"></div>
      <div class="field"><label for="urlAuth" data-i18n="open.urlAuth">Access token (optional)</label><input id="urlAuth" type="password" autocomplete="off" placeholder="Bearer …"></div>
      <div class="row-actions"><button class="btn primary" id="openUrl" data-i18n="open.urlBtn">Open link</button></div>
      <p class="hint" data-i18n="open.urlHint"></p>
    </section>
    <section>
      <h2 data-i18n="ref.title">Reference</h2>
      <p class="hint ref-info" id="refInfo"></p>
      <label class="drop-zone" for="pickRef"><strong data-i18n="ref.pick">Choose .fa and .fai</strong><span data-i18n="ref.pickSub">for .fa.gz also choose .gzi</span></label>
      <input id="pickRef" type="file" multiple accept=".fa,.fasta,.fna,.gz,.fai,.gzi" hidden>
      <div class="field"><label for="refPreset" data-i18n="ref.preset">Public genome</label>
        <select id="refPreset"><option value="" data-i18n="ref.presetNone">Choose…</option><option value="hg38">GRCh38 / hg38</option><option value="hg19">GRCh37 / hg19</option><option value="chm13">T2T-CHM13 v2.0</option></select></div>
      <div class="field"><label for="refUrl" data-i18n="ref.url">FASTA link</label><input id="refUrl" type="url" data-i18n-ph="ref.urlPh" placeholder="https://…/genome.fa (.fai next to it)"></div>
      <div class="row-actions"><button class="btn primary" id="loadRef" data-i18n="ref.load">Load reference</button></div>
      <p class="hint" data-i18n="ref.presetHint"></p>
      <p class="hint" data-i18n="ref.hint"></p>
    </section>
    <section>
      <h2 data-i18n="open.demo">Demo</h2>
      <button class="btn" id="openDemo" data-i18n="open.demoBtn">Synthetic demo data</button>
      <p class="hint" data-i18n="open.demoHint"></p>
    </section>
  </aside>

  <aside id="panel" class="side" hidden data-i18n-aria="view.title" aria-label="View settings">
    <header><h1 data-i18n="view.title">View</h1><button class="btn ghost" data-close data-i18n="btn.close">Close</button></header>
    <section>
      <h2 data-i18n="view.reads">Reads</h2>
      <div class="field"><label for="readHeight" data-i18n="view.readHeight">Read height</label><output id="readHeightOut"></output><input id="readHeight" type="range" min="1" max="24" step="0.5"></div>
      <p class="hint" data-i18n="view.menuHint"></p>
      <div class="check"><input id="bqShade" type="checkbox"><label for="bqShade" data-i18n="view.bqShade"></label></div>
      <div class="check"><input id="softClips" type="checkbox"><label for="softClips" data-i18n="view.softClips"></label></div>
    </section>
    <section>
      <h2 data-i18n="view.mq">MAPQ transparency</h2>
      <div class="pair">
        <div class="field"><label for="mqLow" data-i18n="view.mqLow">From MQ</label><input id="mqLow" type="number" min="0" max="255" step="1"></div>
        <div class="field"><label for="mqHigh" data-i18n="view.mqHigh">To MQ</label><input id="mqHigh" type="number" min="0" max="255" step="1"></div>
      </div>
      <div class="field"><label for="mqMinAlpha" data-i18n="view.mqMinAlpha"></label><output id="mqMinAlphaOut"></output><input id="mqMinAlpha" type="range" min="0.02" max="1" step="0.01"></div>
      <div class="legend" id="mqLegend"></div>
      <div class="legend-labels"><span id="mqLegendLo"></span><span id="mqLegendHi"></span></div>
      <p class="hint" data-i18n="view.mqHint"></p>
    </section>
    <section>
      <h2 data-i18n="view.group">Group</h2>
      <div class="field"><label for="groupBy" data-i18n="view.groupBy">Group by</label>
        <select id="groupBy"><option value="none" data-i18n="group.none"></option><option value="strand" data-i18n="group.strand"></option><option value="firstOfPair" data-i18n="group.firstOfPair"></option><option value="pair" data-i18n="group.pair"></option><option value="tag" data-i18n="group.tag"></option></select></div>
      <div class="field" id="groupTagRow"><label for="groupTag" data-i18n="view.groupTag">Tag for grouping</label><input id="groupTag" type="text" maxlength="2" spellcheck="false"></div>
    </section>
    <section>
      <h2 data-i18n="view.filters">Filters</h2>
      <div class="field"><label for="minMapq" data-i18n="view.minMapq">Minimum MAPQ</label><input id="minMapq" type="number" min="0" max="255" step="1"></div>
      <div class="check"><input id="hideDup" type="checkbox"><label for="hideDup" data-i18n="view.hideDup"></label></div>
      <div class="check"><input id="hideSec" type="checkbox"><label for="hideSec" data-i18n="view.hideSec"></label></div>
      <div class="check"><input id="hideSupp" type="checkbox"><label for="hideSupp" data-i18n="view.hideSupp"></label></div>
      <div class="check"><input id="hideQc" type="checkbox"><label for="hideQc" data-i18n="view.hideQc"></label></div>
      <div class="check"><input id="dsOn" type="checkbox"><label for="dsOn" data-i18n="view.downsample"></label></div>
      <div class="pair">

// CGV core: data sources, BGZF, BAI, BAM, FASTA, model (coverage, layout).
// No external dependencies. Decompression uses the browser's built-in DecompressionStream('deflate-raw').
'use strict';

// ======================= Data sources =======================
// One interface: read(start, len) -> Uint8Array, readAll() -> Uint8Array.
class FileSource {
  constructor(blob, name) { this.blob = blob; this.name = name || blob.name || 'file'; this.bytes = 0; }
  async read(start, len) {
    const end = Math.min(start + len, this.blob.size);
    if (end <= start) return new Uint8Array(0);
    const b = new Uint8Array(await this.blob.slice(start, end).arrayBuffer());
    this.bytes += b.length; return b;
  }
  async readAll() { const b = new Uint8Array(await this.blob.arrayBuffer()); this.bytes += b.length; return b; }
}

class UrlSource {
  constructor(url, headers) {
    this.url = url; this.headers = headers || {}; this.bytes = 0;
    try { this.name = decodeURIComponent(new URL(url).pathname.split('/').pop()) || url; } catch (e) { this.name = url; }
  }
  async _fetch(range) {
    const h = Object.assign({}, this.headers);
    if (range) h.Range = range;
    let r;
    try { r = await fetch(this.url, { headers: h, credentials: 'omit', mode: 'cors' }); }
    catch (e) { throw new CgvError('network', { name: this.name }); }
    if (r.status === 401 || r.status === 403) throw new CgvError('auth', { status: r.status, name: this.name });
    if (r.status === 404) throw new CgvError('notfound', { name: this.name });
    if (!r.ok) throw new CgvError('http', { status: r.status, name: this.name });
    return r;
  }
  async read(start, len) {
    const r = await this._fetch('bytes=' + start + '-' + (start + len - 1));
    const buf = new Uint8Array(await r.arrayBuffer());
    this.bytes += buf.length;
    if (r.status === 200) { // server ignored Range and sent the whole file
      this.noRange = true;
      return buf.subarray(start, Math.min(start + len, buf.length));
    }
    return buf;
  }
  async readAll() { const r = await this._fetch(null); const b = new Uint8Array(await r.arrayBuffer()); this.bytes += b.length; return b; }
}

// Errors carry a code and values; the UI turns them into text in the chosen language.
const CGV_ERR_EN = {
  network: 'Cannot reach {name}. Check the link and that the server allows CORS and Range requests.',
  auth: 'Access denied ({status}): {name}. The link has expired or a token is needed.',
  notfound: 'File not found (404): {name}', noIndex: 'No index found for {name} (tried {tried})', http: 'The server answered {status} for {name}',
  bgzf: 'The file is damaged or not BGZF (offset {offset})', bsize: 'A BGZF block has no BSIZE field',
  notBai: 'This is not a BAI index (.bai)', notBam: 'This is not a BAM file (no BAM signature)', header: 'Could not read the BAM header',
  headerCut: 'The BAM header is cut short — the file is incomplete', headerBig: 'The BAM header is too large',
  fai: 'Empty or invalid FASTA index (.fai)', gzi: 'Invalid .gzi index', needGzi: 'A compressed .fa.gz needs its .gzi index',
  faIrregular: 'Sequence {name} has lines of different lengths, so it cannot be indexed. Rewrap it to a fixed width, e.g. with seqkit seq -w 60.', faEmpty: 'No sequences found — is this a FASTA file?',
};
class CgvError extends Error {
  constructor(code, vars) {
    super((CGV_ERR_EN[code] || code).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? vars[k] : m)));
    this.code = code; this.vars = vars || {};
  }
}

// ======================= BGZF =======================
async function inflateRaw(u8) {
  const ds = new DecompressionStream('deflate-raw');
  const w = ds.writable.getWriter();
  w.write(u8).catch(() => {}); w.close().catch(() => {});
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}

function parseBgzfBlocks(buf, baseCoff) {
  const blocks = []; let p = 0;
  while (p + 18 <= buf.length) {
    if (buf[p] !== 31 || buf[p + 1] !== 139) throw new CgvError('bgzf', { offset: baseCoff + p });
    const xlen = buf[p + 10] | (buf[p + 11] << 8);
    let q = p + 12, bsize = -1; const xend = p + 12 + xlen;
    while (q + 4 <= xend) {
      const slen = buf[q + 2] | (buf[q + 3] << 8);
      if (buf[q] === 66 && buf[q + 1] === 67) bsize = buf[q + 4] | (buf[q + 5] << 8);
      q += 4 + slen;
    }
    if (bsize < 0) throw new CgvError('bsize');
    const total = bsize + 1;
    if (p + total > buf.length) break;
    blocks.push({ coff: baseCoff + p, cstart: p + 12 + xlen, clen: total - xlen - 20 });
    p += total;
  }
  return blocks;
}

// Reads and inflates the blocks from cStart through the block starting at cLast.
async function readBgzf(source, cStart, cLast) {
  const raw = await source.read(cStart, cLast - cStart + 65536);
  const blocks = parseBgzfBlocks(raw, cStart).filter(b => b.coff <= cLast);
  const parts = await Promise.all(blocks.map(b => inflateRaw(raw.subarray(b.cstart, b.cstart + b.clen))));
  let total = 0; const offs = new Map();
  blocks.forEach((b, i) => { offs.set(b.coff, total); total += parts[i].length; });
  const data = new Uint8Array(total); let o = 0;
  for (const p of parts) { data.set(p, o); o += p.length; }
  return { data, offs };
}

// ======================= BAI =======================
// BGZF virtual offset as a Number: coffset * 65536 + uoffset (exact for files up to ~137 GB).
function voffNum(dv, o) { const lo = dv.getUint32(o, true), hi = dv.getUint32(o + 4, true); return (hi * 65536 + (lo >>> 16)) * 65536 + (lo & 0xffff); }

function reg2bins(beg, end) {
  const list = [0]; end -= 1;
  for (let k = 1 + (beg >> 26); k <= 1 + (end >> 26); k++) list.push(k);
  for (let k = 9 + (beg >> 23); k <= 9 + (end >> 23); k++) list.push(k);
  for (let k = 73 + (beg >> 20); k <= 73 + (end >> 20); k++) list.push(k);
  for (let k = 585 + (beg >> 17); k <= 585 + (end >> 17); k++) list.push(k);
  for (let k = 4681 + (beg >> 14); k <= 4681 + (end >> 14); k++) list.push(k);
  return list;
}

class BaiIndex {
  constructor(u8) {
    if (u8.length < 8 || u8[0] !== 66 || u8[1] !== 65 || u8[2] !== 73 || u8[3] !== 1) throw new CgvError('notBai');
    this.dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const nref = this.dv.getInt32(4, true);
    this.refs = []; let p = 8; const dv = this.dv;
    for (let r = 0; r < nref; r++) {
      const start = p; const nbin = dv.getInt32(p, true); p += 4;
      for (let b = 0; b < nbin; b++) { const nchunk = dv.getInt32(p + 4, true); p += 8 + nchunk * 16; }
      const nintv = dv.getInt32(p, true); p += 4 + nintv * 8;
      this.refs.push({ start, parsed: null });
    }
  }
  ref(r) {
    const R = this.refs[r]; if (!R) return null;
    if (R.parsed) return R.parsed;
    const dv = this.dv; let p = R.start;
    const nbin = dv.getInt32(p, true); p += 4; const bins = new Map();
    for (let b = 0; b < nbin; b++) {
      const bin = dv.getUint32(p, true), nchunk = dv.getInt32(p + 4, true); p += 8;
      if (bin === 37450) { p += nchunk * 16; continue; }
      const list = [];
      for (let c = 0; c < nchunk; c++) { list.push([voffNum(dv, p), voffNum(dv, p + 8)]); p += 16; }
      bins.set(bin, list);
    }
    const nintv = dv.getInt32(p, true); p += 4;
    const linear = new Float64Array(nintv);
    for (let i = 0; i < nintv; i++) linear[i] = voffNum(dv, p + i * 8);
    return (R.parsed = { bins, linear });
  }
  chunks(r, beg, end) {
    const R = this.ref(r); if (!R) return [];
    let minOff = 0;
    if (R.linear.length) minOff = R.linear[Math.min(beg >> 14, R.linear.length - 1)];
    const cs = [];
    for (const b of reg2bins(beg, end)) {
      const list = R.bins.get(b); if (!list) continue;
      for (const c of list) if (c[1] > minOff) cs.push([Math.max(c[0], minOff), c[1]]);
    }
    cs.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const c of cs) {
      const last = merged[merged.length - 1];
      // merge when the gap is under 64 KB of compressed data: one request is cheaper than two
      if (last && Math.floor(c[0] / 65536) <= Math.floor(last[1] / 65536) + 65536) { if (c[1] > last[1]) last[1] = c[1]; }
      else merged.push([c[0], c[1]]);
    }
    return merged;
  }
}

// ======================= BAM =======================
function latin1(u8, start, len) { let s = ''; for (let i = 0; i < len; i++) s += String.fromCharCode(u8[start + i]); return s; }
const SEQ_CODES = '=ACMGRSVTWYHKDBN';
const CIGAR_OPS = 'MIDNSHP=X';

class BamFile {
  constructor(bamSource, baiSource) { this.src = bamSource; this.baiSrc = baiSource; this.maxSpan = 0; }
  // baiSource may be a list of candidates (e.g. sample.bam.bai, then sample.bai): the first one that
  // exists is used.
  async open() {
    const [idx] = await Promise.all([this._readIndex(), this._readHeader()]);
    this.index = new BaiIndex(idx);
    return this;
  }
  async _readIndex() {
    const list = Array.isArray(this.baiSrc) ? this.baiSrc : [this.baiSrc];
    let first = null;
    for (const s of list) {
      try { const b = await s.readAll(); this.baiSrc = s; return b; }
      catch (e) {
        // a missing object answers 404, or 403 on buckets without listing rights, or fails CORS
        if (list.length === 1 || !['notfound', 'auth', 'http', 'network'].includes(e.code)) throw e;
        if (!first || first.code === 'notfound') first = e;
      }
    }
    if (first.code === 'notfound' || first.code === 'auth') throw new CgvError('noIndex', { name: this.src.name, tried: list.map(s => s.name).join(', ') });
    throw first;
  }
  async _readHeader() {
    let size = 1 << 16;
    for (let attempt = 0; attempt < 12; attempt++) {
      const raw = await this.src.read(0, size);
      const blocks = parseBgzfBlocks(raw, 0);
      if (!blocks.length) throw new CgvError('header');
      const parts = await Promise.all(blocks.map(b => inflateRaw(raw.subarray(b.cstart, b.cstart + b.clen))));
      let total = 0; parts.forEach(p => total += p.length);
      const d = new Uint8Array(total); let o = 0; for (const p of parts) { d.set(p, o); o += p.length; }
      const h = tryParseBamHeader(d);
      if (h) { Object.assign(this, h); return; }
      if (raw.length < size) throw new CgvError('headerCut');
      size *= 2;
    }
    throw new CgvError('headerBig');
  }
  refId(name) {
    if (this.refIndex.has(name)) return this.refIndex.get(name);
    if (!this._keys) { this._keys = new Map(); this.refs.forEach((r, i) => { const k = contigKey(r.name); if (!this._keys.has(k)) this._keys.set(k, i); }); }
    const id = this._keys.get(contigKey(name));
    return id === undefined ? -1 : id;
  }
  // Reads overlapping [beg, end) on refId.
  // opts.filters: load-time filters (flag bits, MAPQ). opts.downsample: { max, window } — keep at most
  // `max` reads starting in each `window` bp, as IGV does; coverage still counts every read that passes
  // the filters. Returns { reads, cov (6 counters per bp over [beg, end)), total, sampled: [[s, e]...] }.
  async fetch(refId, beg, end, opts) {
    opts = opts || {};
    const flt = opts.filters || null;
    const ds = opts.downsample && opts.downsample.max > 0 && opts.downsample.window > 0 ? opts.downsample : null;
    const cov = new SparseCoverage(beg, end);
    const out = { reads: [], cov, total: 0, sampled: [] };
    let win = -1, n = 0, kept = [], rng = 1;
    const flush = () => {
      if (kept.length) { kept.sort((a, b) => a.pos - b.pos); for (const r of kept) out.reads.push(r); }
      if (ds && n > ds.max) out.sampled.push([win * ds.window, (win + 1) * ds.window]);
      kept = []; n = 0;
    };
    const visit = (buf, dv, p, pos) => {
      const s = p + 4, flag = dv.getUint16(s + 14, true), mapq = buf[s + 9];
      if (flag & 4) return;
      const lrn = buf[s + 8], ncig = dv.getUint16(s + 12, true), cig = s + 32 + lrn;
      let refLen = 0;
      for (let i = 0; i < ncig; i++) { const c = dv.getUint32(cig + 4 * i, true), op = c & 15; if (op === 0 || op === 2 || op === 3 || op === 7 || op === 8) refLen += c >>> 4; }
      if (refLen > this.maxSpan) this.maxSpan = refLen;
      if (pos + Math.max(refLen, 1) <= beg) return;
      if (flt && !passFlags(flag, mapq, flt)) return;
      addCoverage(buf, dv, p, cov);
      if (!ds || pos >= beg) out.total++;
      if (!ds) { out.reads.push(parseBamRecord(buf, dv, p)); return; }
      // Downsampling decides per window of read starts. A read starting before `beg` belongs to a window
      // this query only partly sees, so the choice there could differ from a wider query. Such reads
      // count for coverage but are not returned: what is returned for a window never depends on where
      // the query began. Callers start the query a read length early to cover the left edge.
      if (pos < beg) return;
      const w = Math.floor(pos / ds.window);
      if (w !== win) { flush(); win = w; rng = (Math.imul(w + 1, 2654435761) >>> 0) || 1; }
      n++;
      if (kept.length < ds.max) kept.push(parseBamRecord(buf, dv, p));
      else { rng ^= rng << 13; rng >>>= 0; rng ^= rng >>> 17; rng ^= rng << 5; rng >>>= 0; const j = rng % n; if (j < ds.max) kept[j] = parseBamRecord(buf, dv, p); }
    };
    // chunks are disjoint and in file order, so reads arrive sorted by position
    for (const c of this.index.chunks(refId, beg, end)) await this._scanChunk(c, refId, beg, end, visit);
    flush();
    return out;
  }
  // Streams one index chunk in slabs, calling visit(buf, dv, p, pos) for records of refId that start
  // before `end`. Stops as soon as reads pass `end`, so the rest of the chunk is never read.
  // Remembers where records start in BGZF blocks, so later queries can skip ahead.
  async _scanChunk(c, refId, beg, end, visit) {
    let c0 = Math.floor(c[0] / 65536), u0 = c[0] % 65536;
    const cEnd = Math.floor(c[1] / 65536), uEnd = c[1] % 65536;
    const jump = this._jump(refId, beg, c0, u0, cEnd);
    if (jump) { c0 = jump.coff; u0 = jump.uoff; }
    if (!this.blocks) this.blocks = new Map();
    let carry = new Uint8Array(0), coff = c0, first = true;
    const SLAB = 1 << 20;
    for (;;) {
      const raw = await this.src.read(coff, SLAB);
      const blocks = raw.length ? parseBgzfBlocks(raw, coff) : [];
      if (!blocks.length) return;
      const use = blocks.filter(b => b.coff <= cEnd);
      const parts = await Promise.all(use.map(b => inflateRaw(raw.subarray(b.cstart, b.cstart + b.clen))));
      for (let i = 0; i < use.length; i++) {
        const bcoff = use[i].coff, shift = first ? u0 : 0;
        let part = shift ? parts[i].subarray(shift) : parts[i];
        first = false;
        let buf = part;
        if (carry.length) { buf = new Uint8Array(carry.length + part.length); buf.set(carry); buf.set(part, carry.length); }
        const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength), cl = carry.length;
        let p = 0, cached = this.blocks.has(bcoff);
        while (p + 4 <= buf.length) {
          const bs = dv.getInt32(p, true);
          if (bs < 32 || p + 4 + bs > buf.length) break;
          const inBlock = p - cl; // >= 0: the record starts in this block, at uoff inBlock + shift
          if (bcoff === cEnd && inBlock >= 0 && inBlock + shift >= uEnd) return;
          const refID = dv.getInt32(p + 4, true), pos = dv.getInt32(p + 8, true);
          if (!cached && inBlock >= 0) { this.blocks.set(bcoff, { refID, pos, uoff: inBlock + shift }); cached = true; }
          if (refID !== refId) { if (refID > refId || refID < 0) return; p += 4 + bs; continue; }
          if (pos >= end) return;
          visit(buf, dv, p, pos);
          p += 4 + bs;
        }
        carry = buf.slice(p);
      }
      if (use.length < blocks.length) return;
      const last = blocks[blocks.length - 1];
      coff += last.cstart + last.clen + 8;
    }
  }
  // Compressed bytes the index points to for [beg, end): a cheap estimate of the work before reading.
  estimateBytes(refId, beg, end) {
    let n = 0;
    for (const c of this.index.chunks(refId, beg, end)) n += Math.floor(c[1] / 65536) - Math.floor(c[0] / 65536) + 65536;
    return n;
  }
  // Latest remembered record start in [c0, cEnd] that is safely left of `beg`
  // (further left than the longest alignment seen in this file).
  _jump(refId, beg, c0, u0, cEnd) {
    if (!this.blocks) return null;
    const limit = beg - Math.max(this.maxSpan, 1000) - 1;
    let best = null;
    for (const [coff, b] of this.blocks) {
      if (coff < c0 || coff > cEnd || b.refID !== refId || b.pos > limit) continue;
      if (coff === c0 && b.uoff <= u0) continue;
      if (!best || coff > best.coff) best = { coff, uoff: b.uoff };
    }
    return best;
  }
}

// Case-insensitive contig key: Chr1, chr1, CHR1 and 1 match; M and MT are the same contig.
function contigKey(name) {
  const k = String(name).toLowerCase().replace(/^chr/, '');
  return k === 'm' ? 'mt' : k;
}

// Name variants of one sequence: the whole name, the name without a version suffix (NG_012345.1),
// and each field of an NCBI-style header (gi|224589800|ref|NC_000001.10|).
function contigKeys(name) {
  const out = new Set(), add = n => { if (!n) return; const k = contigKey(n); out.add(k); out.add(k.replace(/\.\d+$/, '')); };
  add(name);
  if (name.includes('|')) for (const f of name.split('|')) if (f && !/^(gi|ref|gb|emb|dbj|lcl|\d+)$/i.test(f)) add(f);
  return [...out];
}
// Matches BAM contigs to reference sequences: by name (case, chr prefix, version and NCBI header
// fields ignored), then, for what is left, by a length that only one sequence on each side has.
// A name match with a different length is not a match but a conflict: the same name in another
// genome build (chr1 is 249,250,621 bp in GRCh37 and 248,956,422 bp in GRCh38). Coordinates would be
// wrong, so such contigs are never paired, and the caller refuses the sample when a large one differs.
function matchContigs(bamRefs, faRefs) {
  const byKey = new Map();
  for (const f of faRefs) for (const k of contigKeys(f.name)) if (!byKey.has(k)) byKey.set(k, f);
  const matched = [], used = new Set(), left = [], conflicts = [];
  for (const b of bamRefs) {
    let hit = null;
    for (const k of contigKeys(b.name)) if (byKey.has(k)) { hit = byKey.get(k); break; }
    if (hit && b.len && hit.len && b.len !== hit.len) { conflicts.push([b.name, b.len, hit.name, hit.len]); used.add(hit.name); continue; }
    if (hit) { matched.push([b.name, hit.name, 'name']); used.add(hit.name); } else left.push(b);
  }
  const count = (arr, len) => arr.filter(x => x.len === len).length;
  const faLeft = faRefs.filter(f => !used.has(f.name));
  for (const b of left) {
    if (count(left, b.len) !== 1) continue;
    const cand = faLeft.filter(f => f.len === b.len);
    if (cand.length === 1) { matched.push([b.name, cand[0].name, 'length']); used.add(cand[0].name); }
  }
  const m = new Set(matched.map(x => x[0]));
  return { matched, conflicts, unmatched: bamRefs.filter(b => !m.has(b.name)).map(b => b.name) };
}

function passFlags(flag, mapq, flt) {
  if (mapq < flt.minMapq) return false;
  if (flt.hideDuplicates && flag & 1024) return false;
  if (flt.hideSecondary && flag & 256) return false;
  if (flt.hideSupplementary && flag & 2048) return false;
  if (flt.hideQcFail && flag & 512) return false;
  return true;
}

// Coverage over [start, end) stored in 64 kb blocks that exist only where reads are, so a
// 50 Mb window with a few reads costs a few blocks, not gigabytes. 6 counters per base: A C G T N del.
const COV_BLOCK = 65536;
class SparseCoverage {
  constructor(start, end) { this.start = start; this.end = end; this.blocks = new Map(); }
  block(bi, create) {
    let b = this.blocks.get(bi);
    if (!b && create) { b = new Uint32Array(COV_BLOCK * 6); this.blocks.set(bi, b); }
    return b;
  }
  // counter k (0..5) at a position
  get(pos, k) { const b = this.blocks.get(Math.floor(pos / COV_BLOCK)); return b ? b[(pos % COV_BLOCK) * 6 + k] : 0; }
  // all six counters at a position into out (an array of 6), returns out
  counts(pos, out) {
    const b = pos >= this.start && pos < this.end ? this.blocks.get(Math.floor(pos / COV_BLOCK)) : null;
    if (!b) { out.fill(0); return out; }
    const o = (pos % COV_BLOCK) * 6; for (let k = 0; k < 6; k++) out[k] = b[o + k];
    return out;
  }
  // calls f(pos, block, offset) for every position in [a, b) that has a block; skips empty stretches fast
  forEach(a, b, f) {
    a = Math.max(a, this.start); b = Math.min(b, this.end);
    for (let bi = Math.floor(a / COV_BLOCK); bi * COV_BLOCK < b; bi++) {
      const blk = this.blocks.get(bi); if (!blk) continue;
      const s0 = Math.max(a, bi * COV_BLOCK), s1 = Math.min(b, (bi + 1) * COV_BLOCK);
      for (let pos = s0; pos < s1; pos++) f(pos, blk, (pos - bi * COV_BLOCK) * 6);
    }
  }
  hasData(a, b) { a = Math.max(a, this.start); b = Math.min(b, this.end); for (let bi = Math.floor(a / COV_BLOCK); bi * COV_BLOCK < b; bi++) if (this.blocks.has(bi)) return true; return false; }
}

// Adds one record to coverage straight from the BAM buffer, without building an object.
const NIB_IDX = new Uint8Array([4, 0, 1, 4, 2, 4, 4, 4, 3, 4, 4, 4, 4, 4, 4, 4]);
function addCoverage(buf, dv, p, cov) {
  const s = p + 4, lrn = buf[s + 8], ncig = dv.getUint16(s + 12, true), lseq = dv.getInt32(s + 16, true);
  const cig = s + 32 + lrn, seq = cig + 4 * ncig, lo = cov.start, hi = cov.end;
  let r = dv.getInt32(s + 4, true), q = 0, bi = -1, blk = null;
  const slot = pos => { const b = Math.floor(pos / COV_BLOCK); if (b !== bi) { bi = b; blk = cov.block(b, true); } return (pos - b * COV_BLOCK) * 6; };
  for (let i = 0; i < ncig; i++) {
    const c = dv.getUint32(cig + 4 * i, true), op = c & 15, n = c >>> 4;
    if (op === 0 || op === 7 || op === 8) {
      for (let k = 0; k < n; k++) {
        const pos = r + k;
        if (pos >= lo && pos < hi) { const qi = q + k; const code = lseq ? (qi & 1 ? buf[seq + (qi >> 1)] & 15 : buf[seq + (qi >> 1)] >> 4) : 15; const o = slot(pos); blk[o + NIB_IDX[code]]++; }
      }
      r += n; q += n;
    } else if (op === 2) { for (let k = 0; k < n; k++) { const pos = r + k; if (pos >= lo && pos < hi) { const o = slot(pos); blk[o + 5]++; } } r += n; }
    else if (op === 3) r += n;
    else if (op === 1 || op === 4) q += n;
  }
}

// Reference bases kept only in stretches that are needed (under reads, or the view when zoomed in).
class SparseRef {
  constructor() { this.segs = []; this.last = null; } // segs: { s, a: Uint8Array } sorted by s, disjoint
  add(s, a) { this.segs.push({ s, a }); this.segs.sort((x, y) => x.s - y.s); }
  at(pos) {
    const L = this.last;
    if (L && pos >= L.s && pos < L.s + L.a.length) return L.a[pos - L.s];
    let lo = 0, hi = this.segs.length - 1;
    while (lo <= hi) { const m = (lo + hi) >> 1, g = this.segs[m]; if (pos < g.s) hi = m - 1; else if (pos >= g.s + g.a.length) lo = m + 1; else { this.last = g; return g.a[pos - g.s]; } }
    return 0;
  }
}
// Merges [s, e) intervals that are closer than `gap`.
function mergeIntervals(list, gap) {
  list.sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const [s, e] of list) { const l = out[out.length - 1]; if (l && s <= l[1] + gap) { if (e > l[1]) l[1] = e; } else out.push([s, e]); }
  return out;
}
// Position of a read base at a reference position: { qi } for a base, { del: true } inside a
// deletion, null outside the read or in a skipped region.
function queryAt(rec, pos) {
  if (pos < rec.pos || pos >= rec.end) return null;
  let r = rec.pos, q = 0;
  for (const c of rec.cigar) {
    const op = c & 15, n = c >>> 4;
    if (op === 0 || op === 7 || op === 8) { if (pos < r + n) return { qi: q + pos - r }; r += n; q += n; }
    else if (op === 2) { if (pos < r + n) return { del: true }; r += n; }
    else if (op === 3) { if (pos < r + n) return null; r += n; }
    else if (op === 1 || op === 4) q += n;
  }
  return null;
}

function tryParseBamHeader(d) {
  if (d.length < 12) return null;
  if (d[0] !== 66 || d[1] !== 65 || d[2] !== 77 || d[3] !== 1) throw new CgvError('notBam');
  const dv = new DataView(d.buffer, d.byteOffset, d.byteLength);
  const lText = dv.getInt32(4, true); let p = 8 + lText;
  if (p + 4 > d.length) return null;
  const text = new TextDecoder().decode(d.subarray(8, 8 + lText)).replace(/\0+$/, '');
  const nRef = dv.getInt32(p, true); p += 4;
  const refs = [], refIndex = new Map();
  for (let i = 0; i < nRef; i++) {
    if (p + 4 > d.length) return null;
    const ln = dv.getInt32(p, true); p += 4;
    if (p + ln + 4 > d.length) return null;
    const name = latin1(d, p, ln - 1); p += ln;
    const len = dv.getInt32(p, true); p += 4;
    refs.push({ name, len }); refIndex.set(name, i);
  }
  const samples = [];
  for (const line of text.split('\n')) if (line.startsWith('@RG')) { const m = line.match(/\tSM:([^\t]+)/); if (m && !samples.includes(m[1])) samples.push(m[1]); }
  return { headerText: text, refs, refIndex, samples };
}

function parseBamRecord(data, dv, p) {
  const bs = dv.getInt32(p, true), s = p + 4;
  const lrn = data[s + 8], ncig = dv.getUint16(s + 12, true), lseq = dv.getInt32(s + 16, true);
  let q = s + 32;
  const name = latin1(data, q, lrn - 1); q += lrn;
  const cigar = new Uint32Array(ncig);
  for (let i = 0; i < ncig; i++) cigar[i] = dv.getUint32(q + 4 * i, true);
  q += 4 * ncig;
  const seqLen = (lseq + 1) >> 1;
  const seq = data.slice(q, q + seqLen); q += seqLen;
  const qual = data.slice(q, q + lseq); q += lseq;
  const tags = data.slice(q, s + bs);
  const pos = dv.getInt32(s + 4, true);
  let refLen = 0;
  for (let i = 0; i < ncig; i++) { const op = cigar[i] & 15; if (op === 0 || op === 2 || op === 3 || op === 7 || op === 8) refLen += cigar[i] >>> 4; }
  return {
    refID: dv.getInt32(s, true), pos, end: pos + Math.max(refLen, 1), name,
    mapq: data[s + 9], flag: dv.getUint16(s + 14, true), lseq,
    mateRef: dv.getInt32(s + 20, true), matePos: dv.getInt32(s + 24, true), tlen: dv.getInt32(s + 28, true),
    cigar, seq, qual, tagBytes: tags, _tags: null, feats: null,
  };
}

function readBase(rec, i) { const b = rec.seq[i >> 1]; return SEQ_CODES.charCodeAt(i & 1 ? b & 15 : b >> 4); }

    let v;

      case 'A': v = String.fromCharCode(t[p]); p += 1; break;
      case 'c': v = dv.getInt8(p); p += 1; break;
      case 'C': v = t[p]; p += 1; break;
      case 's': v = dv.getInt16(p, true); p += 2; break;
      case 'S': v = dv.getUint16(p, true); p += 2; break;
      case 'i': v = dv.getInt32(p, true); p += 4; break;
      case 'I': v = dv.getUint32(p, true); p += 4; break;
      case 'f': v = dv.getFloat32(p, true); p += 4; break;
      case 'Z': case 'H': { let e = p; while (e < t.length && t[e] !== 0) e++; v = latin1(t, p, e - p); p = e + 1; break; }

// Rebuilds reference bases from the MD tag into refArr (indexed from winStart).
function fillRefFromMD(rec, refArr, winStart) {
  const md = recTags(rec).MD; if (typeof md !== 'string') return;

  const rp = [], qp = []; let r = rec.pos, q = 0;

    const op = c & 15, n = c >>> 4;
    if (op === 0 || op === 7 || op === 8) { for (let i = 0; i < n; i++) { rp.push(r + i); qp.push(q + i); } r += n; q += n; }
    else if (op === 2) { for (let i = 0; i < n; i++) { rp.push(r + i); qp.push(-1); } r += n; }
    else if (op === 3) r += n;
    else if (op === 1 || op === 4) q += n;

  let k = 0, i = 0;
  const put = (pos, base) => { const j = pos - winStart; if (j >= 0 && j < refArr.length) refArr[j] = base; };
  while (i < md.length && k < rp.length) {
    const ch = md.charCodeAt(i);

// Read features to draw: mismatches, insertions, deletions, skips, soft clips.
// t: 0=mismatch 1=ins 2=del 3=skip(N) 4=softclip-left 5=softclip-right
function computeFeatures(rec, refAt) {
  const f = []; let r = rec.pos, q = 0; const nc = rec.cigar.length;
  for (let ci = 0; ci < nc; ci++) {
    const c = rec.cigar[ci], op = c & 15, n = c >>> 4;

      for (let i = 0; i < n; i++) {
        const qb = readBase(rec, q + i);
        if (op === 8) { f.push({ t: 0, pos: r + i, b: qb, q: rec.qual[q + i] }); continue; }
        if (op === 7) continue;
        const rb = refAt(r + i);

    } else if (op === 1) { f.push({ t: 1, pos: r, len: n, q0: q }); q += n; }
    else if (op === 2) { f.push({ t: 2, pos: r, len: n }); r += n; }
    else if (op === 3) { f.push({ t: 3, pos: r, len: n }); r += n; }
    else if (op === 4) { f.push({ t: ci === 0 || (ci === 1 && (rec.cigar[0] & 15) === 5) ? 4 : 5, pos: r, len: n, q0: q }); q += n; }
  }

}

// Read base at a reference position (char code); 0 = not covered, 45 ('-') = deletion.
function baseAtRefPos(rec, pos) {
  if (pos < rec.pos || pos >= rec.end) return 0;
  let r = rec.pos, q = 0;
  for (const c of rec.cigar) {
    const op = c & 15, n = c >>> 4;
    if (op === 0 || op === 7 || op === 8) { if (pos < r + n) return readBase(rec, q + pos - r); r += n; q += n; }
    else if (op === 2 || op === 3) { if (pos < r + n) return op === 2 ? 45 : 0; r += n; }
    else if (op === 1 || op === 4) q += n;
  }
  return 0;
}

// ======================= FASTA =======================
// Plain FASTA + .fai, or bgzip-compressed FASTA + .fai + .gzi.
// ---- Building a FASTA index in the browser (no .fai given) ----
// One pass over the uncompressed bytes gives what samtools faidx writes:
// name, length, offset of the first base, bases per line, bytes per line.
class FaiBuilder {
  constructor() { this.entries = []; this.pos = 0; this.cur = null; this.inHeader = false; this.hdr = []; this.lb = 0; this.lbytes = 0; this.atStart = true; }
  _endLine() {
    const c = this.cur;
    if (!c) { this.lb = this.lbytes = 0; return; }
    if (this.lb === 0) { if (this.lbytes === 0) c.blank = true; this.lb = this.lbytes = 0; return; }
    if (c.blank || c.short) throw new CgvError('faIrregular', { name: c.name });
    if (c.lb === 0) { c.lb = this.lb; c.lw = this.lbytes + 1; }
    else if (this.lb !== c.lb || this.lbytes + 1 !== c.lw) { if (this.lb < c.lb) c.short = true; else throw new CgvError('faIrregular', { name: c.name }); }
    c.len += this.lb; this.lb = this.lbytes = 0;
  }
  push(u8) {
    for (let i = 0; i < u8.length; i++, this.pos++) {
      const ch = u8[i];
      if (this.inHeader) {
        if (ch === 10) {
          this.inHeader = false; this.atStart = true;
          let n = ''; for (const x of this.hdr) { if (x === 32 || x === 9 || x === 13) break; n += String.fromCharCode(x); }
          this.cur = { name: n, len: 0, off: this.pos + 1, lb: 0, lw: 0 }; this.entries.push(this.cur);
        } else if (this.hdr.length < 512) this.hdr.push(ch);
        continue;
      }
      if (ch === 10) { this._endLine(); this.atStart = true; continue; }
      if (this.atStart && ch === 62) { this.inHeader = true; this.hdr = []; continue; }
      this.atStart = false;
      this.lbytes++; if (ch !== 13) this.lb++;

  }
  finish() {
    if (this.lbytes) { const c = this.cur; if (c && c.lb === 0) { c.lb = this.lb; c.lw = this.lbytes + 1; } if (c) c.len += this.lb; }
    const idx = new Map();
    for (const e of this.entries) if (!idx.has(e.name)) idx.set(e.name, { len: e.len, off: e.off, lb: e.lb || 1, lw: e.lw || 2 });
    if (!idx.size) throw new CgvError('faEmpty');

  }
}

function isBgzfHeader(b) { return b.length >= 18 && b[0] === 31 && b[1] === 139 && (b[3] & 4) && b[12] === 66 && b[13] === 67; }

// Indexes a FASTA source with no .fai. Handles plain FASTA, BGZF (.fa.gz from bgzip,
// also builds the .gzi table) and ordinary gzip (decompressed into memory).
// Returns { idx, gzi, src } where src is the source to read sequence from.
async function indexFasta(src, size, onProgress) {
  const head = await src.read(0, 18);
  const b = new FaiBuilder(), SLAB = 8 << 20;
  const report = done => onProgress && onProgress(done, size);
  if (isBgzfHeader(head)) {
    const gzi = [[0, 0]]; let coff = 0, uoff = 0;

      const raw = await src.read(coff, SLAB);
      if (!raw.length) break;
      const blocks = parseBgzfBlocks(raw, coff);
      if (!blocks.length) break;
      const parts = await Promise.all(blocks.map(bl => inflateRaw(raw.subarray(bl.cstart, bl.cstart + bl.clen))));
      for (let i = 0; i < blocks.length; i++) {
        if (blocks[i].coff && parts[i].length) gzi.push([blocks[i].coff, uoff]);
        b.push(parts[i]); uoff += parts[i].length;

      const consumed = last.cstart + last.clen + 8;
      coff += consumed; report(coff);

  }

    const r = ds.readable.getReader(), chunks = []; let done = 0;

    return { idx: b.finish(), gzi: null, src: new FileSource(new Blob(chunks), src.name.replace(/\.gz$/i, '')) };
  }
  for (let off = 0; ; off += SLAB) {
    const raw = await src.read(off, SLAB);
    if (raw.length) b.push(raw);
    report(off + raw.length);
    if (raw.length < SLAB) break;
  }
  return { idx: b.finish(), gzi: null, src };
}

class IndexedFasta {
  constructor(faSource, faiSource, gziSource) { this.src = faSource; this.faiSrc = faiSource || null; this.gziSrc = gziSource || null; this.name = faSource.name; }
  // Index the FASTA in the browser when no .fai is available.
  async openUnindexed(size, onProgress) {
    const r = await indexFasta(this.src, size, onProgress);
    this.idx = r.idx; this.src = r.src; this.built = true;
    if (r.gzi) this.gzi = r.gzi;

  }
  async open() {
    if (/\.gz$/i.test(this.src.name || '') && !this.gziSrc) throw new CgvError('needGzi');
    const t = new TextDecoder().decode(await this.faiSrc.readAll());
    this.idx = new Map();
    for (const line of t.split('\n')) {
      const f = line.split('\t'); if (f.length < 5) continue;

      if (g.length < 8) throw new CgvError('gzi');

      if (g.length < 8 + n * 16) throw new CgvError('gzi');
      this.gzi = [[0, 0]];
      for (let i = 0; i < n; i++) { const o = 8 + i * 16; this.gzi.push([dv.getUint32(o, true) + dv.getUint32(o + 4, true) * 4294967296, dv.getUint32(o + 8, true) + dv.getUint32(o + 12, true) * 4294967296]); }

  }

  async _bytes(u0, u1) {
    if (!this.gzi) return this.src.read(u0, u1 - u0);

    const find = u => { let a = 0, b = g.length - 1, r = 0; while (a <= b) { const m = (a + b) >> 1; if (g[m][1] <= u) { r = m; a = m + 1; } else b = m - 1; } return r; };
    lo = find(u0); hi = find(Math.max(u0, u1 - 1));

  }

  async fetch(name, beg, end) {
    const e = this.entry(name); if (!e) return null;
    beg = Math.max(0, beg); end = Math.min(e.len, end); if (end <= beg) return new Uint8Array(0);
    const o0 = e.off + Math.floor(beg / e.lb) * e.lw + (beg % e.lb);
    const o1 = e.off + Math.floor(end / e.lb) * e.lw + (end % e.lb);
    const raw = await this._bytes(o0, o1);
    const out = new Uint8Array(end - beg); let j = 0;
    for (let i = 0; i < raw.length && j < out.length; i++) { const c = raw[i]; if (c === 10 || c === 13) continue; out[j++] = c & ~32; }
    return out;
  }
}

// ======================= Model =======================
const F_PAIRED = 1, F_PROPER = 2, F_REV = 16, F_MREV = 32, F_R1 = 64, F_R2 = 128, F_SECONDARY = 256, F_QCFAIL = 512, F_DUP = 1024, F_SUPP = 2048;

function passFilters(rec, flt) {
  if (rec.mapq < flt.minMapq) return false;
  if (flt.hideDuplicates && rec.flag & F_DUP) return false;
  if (flt.hideSecondary && rec.flag & F_SECONDARY) return false;
  if (flt.hideSupplementary && rec.flag & F_SUPP) return false;
  if (flt.hideQcFail && rec.flag & F_QCFAIL) return false;
  return true;
}

// Coverage: 6 counters per position (A C G T N del).
const BASE_IDX = new Int8Array(128).fill(4);
BASE_IDX[65] = 0; BASE_IDX[67] = 1; BASE_IDX[71] = 2; BASE_IDX[84] = 3;
function computeCoverage(reads, winStart, winLen) {
  const cov = new Uint32Array(winLen * 6);
  for (const rec of reads) {
    let r = rec.pos, q = 0;
    for (const c of rec.cigar) {
      const op = c & 15, n = c >>> 4;
      if (op === 0 || op === 7 || op === 8) {
        for (let i = 0; i < n; i++) { const j = r + i - winStart; if (j >= 0 && j < winLen) cov[j * 6 + BASE_IDX[readBase(rec, q + i)]]++; }
        r += n; q += n;
      } else if (op === 2) { for (let i = 0; i < n; i++) { const j = r + i - winStart; if (j >= 0 && j < winLen) cov[j * 6 + 5]++; } r += n; }
      else if (op === 3) r += n;
      else if (op === 1 || op === 4) q += n;
    }
  }
  return cov;
}

// Pair orientation for an FR library: 'FR' normal, 'RF', 'FF', 'RR', 'other' (mate on another contig), 'unpaired', 'mateUnmapped'
function pairOrientation(rec) {
  if (!(rec.flag & F_PAIRED)) return 'unpaired';
  if (rec.flag & 8) return 'mateUnmapped';
  if (rec.mateRef !== rec.refID) return 'other';
  const rev = !!(rec.flag & F_REV), mrev = !!(rec.flag & F_MREV);
  const leftRev = rec.pos <= rec.matePos ? rev : mrev, rightRev = rec.pos <= rec.matePos ? mrev : rev;
  if (!leftRev && rightRev) return 'FR';
  if (leftRev && !rightRev) return 'RF';
  return leftRev ? 'RR' : 'FF';
}

// Bounds of an unusual insert size from the loaded data (percentiles, as in IGV).
function insertSizeBounds(reads) {
  const v = [];
  for (const r of reads) if ((r.flag & F_PROPER) && r.tlen > 0) v.push(r.tlen);
  if (v.length < 20) return { lo: 50, hi: 1000 };
  v.sort((a, b) => a - b);
  return { lo: v[Math.floor(v.length * 0.005)], hi: v[Math.floor(v.length * 0.995)] };
}

// ======================= Read layout =======================
// Stable read layout. A read keeps its row for as long as the layout lives (panning, reloads,
// redraws, recoloring); only reads seen for the first time are placed, each into the lowest
// row where it fits. A new layout is made only when what decides placement changes
// (contig, grouping, sort, filters, downsampling), so the picture never reshuffles on its own.

// Identity of an alignment record: name + which segment (first/second, secondary, supplementary) + position.
function readKey(r) { return r.name + '\u0001' + (r.flag & 0x9C0) + '\u0001' + r.pos; }

// One row: disjoint intervals sorted by start.
class LayoutRow {
  constructor() { this.s = []; this.e = []; }
  // index of the first interval starting at or after x
  _at(x) { let lo = 0, hi = this.s.length; while (lo < hi) { const m = (lo + hi) >> 1; if (this.s[m] < x) lo = m + 1; else hi = m; } return lo; }
  fits(s, e, pad) {
    const i = this._at(s);
    if (i > 0 && this.e[i - 1] + pad > s) return false;
    if (i < this.s.length && this.s[i] < e + pad) return false;
    return true;
  }
  add(s, e) {
    const n = this.s.length;
    if (!n || this.s[n - 1] <= s) { this.s.push(s); this.e.push(e); return; }
    const i = this._at(s); this.s.splice(i, 0, s); this.e.splice(i, 0, e);
  }
  // does any interval overlap [a, b)?
  overlaps(a, b) { const i = this._at(b); return i > 0 && this.e[i - 1] > a; }
}

class ReadLayout {
  // sig: anything that, when changed, must produce a fresh layout. pad: minimum gap in bp.
  constructor(sig, pad) { this.sig = sig; this.pad = pad == null ? 2 : pad; this.place = new Map(); this.order = []; this.size = new Map(); }

  // reads: sorted by position. groupOf(r) -> group label. prio: { pos, key(r) -> [a, b] } places the
  // reads covering `pos` first, in key order, one per row from the top (sorting). Used only when the
  // layout is fresh; afterwards the rows it made are kept like any others.
  // Returns { groups: [{ key, rows: [[rec...]], start, count, sets }], totalRows }.
  // keyOf(item) gives a stable identity (readKey for reads; a pair key for pairs). Items need pos and end.
  update(reads, groupOf, prio, keyOf) {
    keyOf = keyOf || readKey;
    const pad = this.pad, fresh = this.place.size === 0;
    const byGroup = new Map();
    for (const r of reads) { const k = groupOf(r); let a = byGroup.get(k); if (!a) byGroup.set(k, a = []); a.push(r); }
    // group order is kept; a new group goes into its sorted place
    for (const k of byGroup.keys()) if (!this.order.includes(k)) this.order.push(k);
    this.order.sort((a, b) => String(a).localeCompare(String(b)));
    const place = new Map(), groups = [];
    let start = 0;
    for (const k of this.order) {
      const list = byGroup.get(k) || [];
      const sets = [], rowOf = new Array(list.length);
      const ensure = n => { while (sets.length <= n) sets.push(new LayoutRow()); };
      const pending = [];
      // 1. reads already placed keep their rows
      for (let i = 0; i < list.length; i++) {
        const r = list[i], key = keyOf(r), old = this.place.get(key);
        // an item keeps its row unless it grew (a pair whose mate arrived) and no longer fits there
        if (old && old.g === k) { ensure(old.r); if (sets[old.r].fits(r.pos, r.end, pad)) { sets[old.r].add(r.pos, r.end); rowOf[i] = old.r; place.set(key, old); continue; } }
        pending.push(i);
      }
      // 2. sorting: reads covering the sort position take rows from the top, in key order
      if (fresh && prio && pending.length) {
        const cover = pending.filter(i => list[i].pos <= prio.pos && list[i].end > prio.pos);
        const keyed = cover.map(i => [prio.key(list[i]), i]);
        keyed.sort((a, b) => a[0][0] - b[0][0] || a[0][1] - b[0][1] || list[a[1]].pos - list[b[1]].pos);
        const taken = new Set();
        keyed.forEach(([, i], n) => { ensure(n); sets[n].add(list[i].pos, list[i].end); rowOf[i] = n; taken.add(i); });
        for (let n = pending.length - 1; n >= 0; n--) if (taken.has(pending[n])) pending.splice(n, 1);
      }
      // 3. everything else goes into the lowest row where it fits
      if (sets.length === 0 && pending.length === list.length) {
        // empty group: sweep with a heap of rows in use and a heap of free row numbers (lowest first)
        const act = new MinHeap((a, b) => a[0] - b[0] || a[1] - b[1]), free = new MinHeap((a, b) => a - b);
        for (const i of pending) {
          const r = list[i];
          while (act.size && act.peek()[0] + pad <= r.pos) free.push(act.pop()[1]);
          const row = free.size ? free.pop() : sets.length;
          ensure(row); sets[row].add(r.pos, r.end); rowOf[i] = row; act.push([r.end, row]);
        }
      } else {
        for (const i of pending) {
          const r = list[i]; let row = 0;
          while (row < sets.length && !sets[row].fits(r.pos, r.end, pad)) row++;
          ensure(row); sets[row].add(r.pos, r.end); rowOf[i] = row;
        }
      }
      for (let i = 0; i < list.length; i++) { const key = keyOf(list[i]); if (!place.has(key)) place.set(key, { g: k, r: rowOf[i] }); }
      // rows never shrink while the layout lives, so groups below never jump up and down
      const n = Math.max(sets.length, this.size.get(k) || 0);
      this.size.set(k, n); ensure(n - 1);
      const rows = Array.from({ length: n }, () => []);
      for (let i = 0; i < list.length; i++) rows[rowOf[i]].push(list[i]);
      groups.push({ key: k, rows, start, count: list.length, sets });
      start += n;
    }
    this.place = place;
    return { groups, totalRows: start };
  }
}

// Reference length of a CIGAR string (for the MC tag: the mate's CIGAR).
function cigarStrRefLen(str) {
  let n = 0, num = 0;
  for (let i = 0; i < str.length; i++) {

document.addEventListener('keydown', e => {

  if (e.key === 'ArrowLeft') pan(-W * 0.15);
  else if (e.key === 'ArrowRight') pan(W * 0.15);
  else if (e.key === 'ArrowUp') { for (const T of S.tracks) T.scroll -= 60; clampScroll(); draw(); }
  else if (e.key === 'ArrowDown') { for (const T of S.tracks) T.scroll += 60; clampScroll(); draw(); }

function resize() {

  DPR = Math.min(window.devicePixelRatio || 1, 3);
  const oldW = W; W = Math.max(1, r.width); H = Math.max(1, r.height);
  for (const c of [glCanvas, ov]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  if (oldW && S.contigs) { const c = S.view.start + oldW * S.view.bpPerPx / 2; S.view.start = c - W * S.view.bpPerPx / 2; clampView(); }

// ======================= Opening data =======================
// Adds a sample as a new track. Its contigs are matched to the current coordinate system — the
// reference, or the first sample's header when no reference is loaded (name variants, then unique
// length); the very first sample without a reference gives the coordinates itself.
// The same file (or link) opened again is not added twice: every track loads its window, so a
// duplicate doubles the work for nothing.
function sourceKey(src) { return src.blob ? `${src.name}|${src.blob.size}|${src.blob.lastModified || 0}` : src.url || src.name; }
async function openBam(bamSrc, baiSrc, opts) {
  opts = opts || {};
  const key = sourceKey(bamSrc);
  if (S.tracks.some(x => x.key === key)) { toast(t('sample.already', { name: bamSrc.name })); return true; }
  S.loading = true; S.msg = null; draw();
  try {
    const bam = await new BamFile(bamSrc, baiSrc).open();
    const back = new Int32Array(bam.refs.length).fill(-1);
    let map, note = '', noteSticky = false;
    const own = !S.fasta && !S.tracks.length; // first sample with no reference: its header is the genome
    if (!own) {
      const link = matchContigs(bam.refs, S.contigs);
      // a large contig with the same name but another length: the sample is from another genome build
      const big = link.conflicts.filter(c => Math.max(c[1], c[3]) > 1e6);
      if (big.length) {
        S.loading = false; draw();
        const eg = big.slice(0, 2).map(c => t('sample.lenPair', { bam: c[0], bl: fmtInt(c[1]), ref: c[2], rl: fmtInt(c[3]) })).join('; ');
        toast(t('sample.build', { name: bamSrc.name, eg }), true);
        return false;
      }
      if (!link.matched.length) {
        S.loading = false; draw();
        const list = (arr, n) => arr.slice(0, n).map(x => `${x.name} (${fmtInt(x.len)} ${t('unit.bp')})`).join(', ') + (arr.length > n ? ` … +${fmtInt(arr.length - n)}` : '');
        toast(t('sample.mismatch', { name: bamSrc.name, bam: list(bam.refs, 3), ref: list(S.contigs, 3) }), true);
        return false;
      }
      const viewIdx = new Map(S.contigs.map((c, i) => [c.name, i])), bamIdx = new Map(bam.refs.map((r, i) => [r.name, i]));
      map = new Int32Array(S.contigs.length).fill(-1);
      for (const [b, f] of link.matched) { map[viewIdx.get(f)] = bamIdx.get(b); back[bamIdx.get(b)] = viewIdx.get(f); }
      const byLen = link.matched.filter(m => m[2] === 'length');
      if (byLen.length) note += t('sample.byLength', { pairs: byLen.slice(0, 3).map(m => m[0] + ' = ' + m[1]).join(', ') + (byLen.length > 3 ? ' …' : '') }) + ' ';
      if (link.conflicts.length) noteSticky = true;
      if (link.conflicts.length) note += t('sample.lenDiff', { names: link.conflicts.slice(0, 3).map(c => t('sample.lenPair', { bam: c[0], bl: fmtInt(c[1]), ref: c[2], rl: fmtInt(c[3]) })).join('; ') }) + ' ';
      if (link.unmatched.length) note += t('sample.partial', { n: fmtInt(link.unmatched.length), names: link.unmatched.slice(0, 3).join(', ') + (link.unmatched.length > 3 ? ' …' : '') });
    } else {
      S.contigs = bam.refs.map(r => ({ name: r.name, len: r.len })); S._ck = null;
      map = Int32Array.from(bam.refs, (r, i) => i); back.forEach((v, i) => { back[i] = i; });
    }
    const keepView = !own && S.viewSet && map[S.view.refId] >= 0;
    if (!opts.demo) for (const x of S.tracks.filter(x => x.demo)) closeTrack(x); // own data replaces the demo sample
    const T = { id: ++S.trackSeq, key, bam, name: bamSrc.name, demo: !!opts.demo, map, back, data: null, shown: null, layout: null, scroll: 0, msg: null, vao: null, n: 0 };
    S.tracks.push(T);
    S.sortPos = S.tracks.length > 1 ? S.sortPos : null; S.selected = null; hideCard();
    updateFileLabel();
    $('examples').hidden = !S.tracks.some(x => x.demo);
    S.loading = false;
    if (note) toast(note.trim(), noteSticky);
    const loc = opts.locus ? parseLocus(opts.locus) : null;
    S.loadToken++; S.data = null; // every track loads the same window: load it again with the new one
    if (loc && !loc.error) goto(loc.id, loc.s, loc.e);
    else if (keepView) { requestLoad(); draw(); }
    else { const i = Math.max(0, map.findIndex(x => x >= 0)); goto(i, 0, Math.min(S.contigs[i].len, 10000)); }
    S.viewSet = true;
    return true;
  } catch (e) {
    S.loading = false;
    if (S.tracks.length) toast(t('sample.failed', { name: bamSrc.name, msg: errText(e) }), true);
    else { S.msg = { text: errText(e), error: true }; }
    draw();
    return false;
  }
}
function closeTrack(T) {

function b64ToBlob(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u]); }

// Pairs each .bam with its index by name: sample.bam ↔ sample.bam.bai or sample.bai (case ignored).
// A single .bam with a single index of any name is a pair too.
function pairBams(files) {
  const L = f => f.name.toLowerCase();
  const bams = files.filter(f => L(f).endsWith('.bam'));
  const idx = new Map(files.filter(f => L(f).endsWith('.bai')).map(f => [L(f), f]));
  const pairs = [], missing = [];
  for (const bam of bams) {
    const n = L(bam), bai = idx.get(n + '.bai') || idx.get(n.slice(0, -4) + '.bai');
    if (bai) pairs.push([bam, bai]); else missing.push(bam);
  }
  if (bams.length === 1 && missing.length === 1 && idx.size === 1) { pairs.push([bams[0], [...idx.values()][0]]); missing.length = 0; }
  return { bams, pairs, missing };
}
// Files chosen or dropped: any number of samples (each with its index) and optionally a reference.
// A folder with several samples first lists them, so a whole run directory is not opened at once.
function openLocalFiles(fileList, fromFolder) {
  const files = [...fileList], L = f => f.name.toLowerCase();
  const { bams, pairs, missing } = pairBams(files);
  const ref = pickRefFiles(files);
  const crams = files.filter(f => L(f).endsWith('.cram'));
  if (!bams.length) {
    if (ref) { openReference(ref); return; }
    toast(t(crams.length ? 'files.cram' : files.some(f => L(f).endsWith('.bai')) ? 'files.needBam' : 'files.needPair'));
    return;
  }
  if (fromFolder && bams.length > 1) { showFolderList(files, pairs, missing); return; }
  if (!pairs.length) {
    const csi = files.some(f => L(f).endsWith('.csi'));
    toast(csi ? t('files.csi') : t('files.noIndex', { names: missing.map(f => f.name).join(', ') }), true);
    return;
  }
  closePanels();
  const notes = [];
  if (missing.length) notes.push(t('files.noIndexSome', { names: missing.map(f => f.name).join(', ') }));
  if (crams.length) notes.push(t('files.cram'));
  // a reference chosen together with the samples is loaded first; the samples are then matched to it
  (ref ? openReference(ref, { noGoto: true }) : Promise.resolve(true)).then(async ok => {
    if (!ok) return;
    for (const [bam, bai] of pairs) await openBam(new FileSource(bam), new FileSource(bai));
    if (notes.length) toast(notes.join(' '), true); // after the reference's own message
  });
}
// A folder with several samples: a checklist in the Open panel.
function showFolderList(files, pairs, missing) {
  const box = $('folderList');
  const rows = pairs.map(([bam], i) => `<label class="chk"><input type="checkbox" data-i="${i}"${i < 4 ? ' checked' : ''}> ${esc(bam.name)}</label>`).join('') +
    missing.map(f => `<div class="hint">${esc(f.name)} — ${esc(t('folder.noIndex'))}</div>`).join('');
  box.innerHTML = `<p class="hint">${esc(t('folder.found', { n: pairs.length + missing.length }))}</p>${rows}` +
    (pairs.length ? `<div class="row-actions"><button class="btn primary" id="folderOpen">${esc(t('folder.open'))}</button></div>` : '');
  box.hidden = false;
  $('openPanel').hidden = false; $('openBtn').setAttribute('aria-expanded', 'true');
  if (!pairs.length) return;
  $('folderOpen').onclick = () => {
    const chosen = [...box.querySelectorAll('input[data-i]:checked')].map(x => pairs[+x.dataset.i]);
    if (!chosen.length) { toast(t('folder.none')); return; }

    const ref = pickRefFiles(files);
    openLocalFiles([...chosen.flat(), ...(ref ? files.filter(f => /\.(fa|fasta|fna)(\.gz)?$|\.fai$|\.gzi$/i.test(f.name)) : [])]);

// Files of a dropped folder (and its subfolders, a few levels deep).
async function droppedFiles(dt) {
  const entries = [...dt.items].map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
  if (!entries.some(e => e.isDirectory)) return { files: [...dt.files], folder: false };
  const out = [];
  const walk = async (e, depth) => {
    if (e.isFile) { out.push(await new Promise((res, rej) => e.file(res, rej))); return; }
    if (depth > 3) return;
    const reader = e.createReader();
    for (;;) { const batch = await new Promise((res, rej) => reader.readEntries(res, rej)); if (!batch.length) break; for (const c of batch) await walk(c, depth + 1); }
  };
  for (const e of entries) await walk(e, 0);
  return { files: out, folder: true };
}

// Links: one per line (or separated by spaces). The index is looked for next to each BAM:
// sample.bam.bai, then sample.bai. The index field applies when there is one link.
function openUrls() {
  const links = $('urlBam').value.split(/\s+/).map(x => x.trim()).filter(Boolean);
  if (!links.length) { toast(t('url.need')); return; }
  const auth = $('urlAuth').value.trim();
  const headers = auth ? { Authorization: /^bearer\s/i.test(auth) ? auth : 'Bearer ' + auth } : {};
  const bams = links.filter(u => !/\.cram(\?|#|$)/i.test(u));
  if (!bams.length) { toast(t('files.cram')); return; }
  if (bams.length < links.length) toast(t('files.cram'));
  const given = bams.length === 1 ? $('urlBai').value.trim() : '';
  closePanels();
  (async () => {
    for (const u of bams) {
      const cands = given ? [given] : [addSuffix(u, '.bai'), swapExt(u, '.bam', '.bai')].filter((x, i, a) => x && a.indexOf(x) === i);
      await openBam(new UrlSource(u, headers), cands.map(x => new UrlSource(x, headers)));
    }
  })();
}
function swapExt(url, from, to) {
  try { const x = new URL(url); if (!x.pathname.toLowerCase().endsWith(from)) return null; x.pathname = x.pathname.slice(0, -from.length) + to; return x.toString(); }
  catch (e) { return url.toLowerCase().endsWith(from) ? url.slice(0, -from.length) + to : null; }
}
function addSuffix(url, sfx) { try { const x = new URL(url); x.pathname += sfx; return x.toString(); } catch (e) { return url + sfx; } }


// ======================= Reference =======================
// Public assemblies hosted by the IGV team on S3 (CORS enabled); same list igv.js uses.
const REF_PRESETS = {
  hg38: { label: 'GRCh38 / hg38', fa: 'https://igv-genepattern-org.s3.amazonaws.com/genomes/seq/hg38/hg38.fa' },
  hg19: { label: 'GRCh37 / hg19', fa: 'https://igv-genepattern-org.s3.amazonaws.com/genomes/seq/hg19/hg19.fasta' },
  chm13: { label: 'T2T-CHM13 v2.0', fa: 'https://s3.amazonaws.com/igv.org.genomes/chm13v2.0/chm13v2.0.fa' },
};
function pickRefFiles(files) {
  const L = f => f.name.toLowerCase();
  const fa = [...files].find(f => /\.(fa|fasta|fna)(\.gz)?$/.test(L(f)));
  if (!fa) return null;
  const fai = [...files].find(f => L(f).endsWith('.fai')) || null;
  const gzi = [...files].find(f => L(f).endsWith('.gzi')) || null;
  return { fa: new FileSource(fa), fai: fai ? new FileSource(fai) : null, gzi: gzi ? new FileSource(gzi) : null, size: fa.size };
}
// ref = { fa, fai?, gzi?, size? } — sources. Without a .fai (or a .fa.gz without .gzi)
// the FASTA is indexed here in one pass, with progress.
let refBusy = false;
// Loading a reference switches the genome: samples opened against the previous one are closed.
async function openReference(ref, opts) {
  opts = opts || {};
  if (refBusy) return false;
  refBusy = true;
  const name = ref.fa.name, gz = /\.gz$/i.test(name);
  try {
    let fasta = null;
    if (ref.fai && (!gz || ref.gzi)) {
      try { fasta = await new IndexedFasta(ref.fa, ref.fai, ref.gzi).open(); }
      catch (e) { if (!(ref.fa instanceof UrlSource) || !['notfound', 'http', 'auth', 'network'].includes(e.code) || e.vars.name === name) throw e; fasta = null; }
    }
    if (!fasta) {
      const fmt = n => n >= 1 << 30 ? (n / (1 << 30)).toFixed(1) + ' GB' : (n / (1 << 20)).toFixed(0) + ' MB';
      toast(t('ref.indexing', { name, done: '0%' }), true);
      fasta = await new IndexedFasta(ref.fa).openUnindexed(ref.size, (done, total) =>
        toast(t('ref.indexing', { name, done: total ? Math.min(100, Math.round(done / total * 100)) + '%' : fmt(done) }), true));
    }
    const closed = S.tracks.length > 0;
    S.loadToken++;
    S.fasta = fasta; S.contigs = [...fasta.idx].map(([n, e]) => ({ name: n, len: e.len })); S._ck = null;
    closeAllTracks();
    S.data = null; S.sortPos = null; S.msg = null; S.loading = false;
    hideCard(); updateRefInfo(); updateFileLabel(); $('examples').hidden = true; closePanels();
    if (!opts.quiet) {
      let note = fasta.built ? t('ref.indexed', { name, n: fmtInt(fasta.idx.size) }) : t('ref.loaded', { name });
      if (closed) note += ' ' + t('ref.closedSamples');
      toast(note, note.length > 90);
    }
    // a new genome means a new coordinate system: the old view no longer applies
    S.view.refId = 0; S.view.start = 0; S.viewSet = false;
    if (!opts.noGoto) { goto(0, 0, Math.min(S.contigs[0].len, 1000)); S.viewSet = true; }
    return true;
  } catch (e) { toast(t('ref.failed', { msg: errText(e) })); return false; }
  finally { refBusy = false; }
}
function updateRefInfo() {
  const el = $('refInfo'); if (!el) return;
  el.textContent = S.fasta ? t('ref.current', { name: S.fasta.name }) : t('ref.none');
}
$('pickRef').onchange = e => { const r = pickRefFiles(e.target.files); e.target.value = ''; if (!r) { toast(t('ref.failed', { msg: t('err.faEmpty') })); return; } openReference(r); };
