# Publishes LGV on GitHub Pages: builds dist/lgv.html and serves it as the site's index.html (also
# as lgv.html), with the user guide next to it. The page reads data only from the user's computer or
# the links the user gives; nothing is uploaded to GitHub.
# Every push to main publishes it (and it can be started by hand: Actions → Pages → Run workflow).
# Needs Pages switched on once: Settings → Pages → Source: GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and check
        run: |
          node tools/build.js
          node tools/audit.js
          node tools/test-core.js
      - name: Site
        run: |
          mkdir -p site/docs
          cp dist/lgv.html site/index.html
          cp dist/lgv.html site/lgv.html
          cp docs/USER_GUIDE.md docs/USER_GUIDE.ru.md site/docs/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
